# 작업대·로봇 베이스 형상 치수 (담당 A). Isaac Sim 트윈 모델링용 값 — 형상 치수는 이 파일에만 둔다.
# 측정: 캘리퍼스·줄자, 2026-10-02 [사용자 보고, 평면도 + 사진 3장]. 단위 cm (모델링 시 m로 변환).
# 서랍의 로봇 베이스 기준 위치는 #6(3점 터치, B·E)이 정본. 이 파일의 작업대 기준 위치는 씬 초기 배치용이며 #6 결과로 교체한다.
# 최대 인출 거리(max_travel_m)는 config/places.yaml(B·E)에 채운다 — 여기에는 따로 적지 않는다.
# null = 아직 측정 안 함.

table:
  width_cm: 120                       # [사용자 보고, 도면] 가로
  depth_cm: 65                        # [사용자 정정 10/02] 도면의 55는 오기. 21 + 23 + 21 = 65로 일치
  surface_height_from_floor_cm: null  # 미측정

# 서랍장(서랍 유닛)은 10/03에 철제 고정대 + 원목 서랍으로 교체하기로 해, 기존 플라스틱 서랍장의 값(외곽·단 높이·받침 선반·손잡이·인출 거리 등)을 모두 삭제했다.
# 새 서랍 설치 후 아래 drawer_unit·drawer_top·plan_view_cm.drawer_* 를 실측으로 채운다. 값이 비어 있으면 build_scene.py 는 서랍장 없이 작업대·로봇만 만든다.
# 서랍 내부 치수·최대 인출 거리·처짐은 config/places.yaml 이 정본이다.

drawer_unit:                          # 새 서랍장: 원목형 2단 일체형, 무거워 별도 고정 불필요 [사용자 실측 10/03, 버니어·자, cm]
  tiers: 2
  width_cm: 38.5                      # 서랍장 본체 가로 (작업대 변과 나란한 방향)
  depth_cm: 26.5                      # 서랍장 본체 세로(깊이)
  total_height_cm: 29.5               # 우드락(아래) 추가 전 기준
  front_panel_protrusion_cm: 1.8      # 닫힌 상태에서 앞판(회색)이 본체 앞면 밖으로 튀어나온 길이. 앞판 쪽이 작업대(로봇) 방향
  riser_cm: 0.5                       # 서랍장 맨 아래에 우드락을 깔아 모든 높이가 0.5 cm 올라감. 아래 높이 값들은 우드락 추가 전 측정 → 씬에서 +riser_cm
  seat: 받침 선반                      # [사용자 확인 10/03] 서랍장 바닥은 작업대가 아니라 선반 위에 놓임 (우드락 0.5 cm를 사이에 깔았음)
  seat_top_vs_table_surface_cm: -0.3  # 선반 윗면이 작업대 윗면보다 3 mm 낮음. 10/02에 잰 값을 같은 선반이라고 보고 복원 — 선반이 그대로인지 확인 필요
  top_board_cm: 1.8                   # 맨 위 판 두께: 서랍장 맨 위 높이 - 1.8 이 2단 천장 아랫면 [사용자 확인 10/03]. 바닥판도 같다고 가정 [추정]
  mid_divider: false                  # [사용자 확인 10/03] 1단과 2단 사이에 가로막는 판이 없음. 서랍은 철제 레일로 열고 닫음
  tier_usage: {upper: drawer_top, lower: drawer_bottom}   # [사용자 확인 10/03]
  tiers_detail:                       # 서랍장 바닥 기준 높이(cm), 우드락 추가 전. 상자 안쪽 바닥면 = 상자 높이 10 만큼 아래 [사용자 확인 10/03]
    upper: {front_bottom_height: 14.8, front_top_height: 29.5, floor_surface: 19.5}   # 옆벽 윗면 = 19.5 + 7 = 26.5, 천장 아랫면 27.7
    lower: {front_bottom_height: 0, front_top_height: 14.8, floor_surface: 4.8}       # 옆벽 윗면 = 4.8 + 7 = 11.8. 위는 2단 상자 바닥까지 열려 있음
  drawer_box:                         # 서랍 상자 = 수납장(물건이 들어가는 부분), 위에서 본 가로 방향 [사용자 실측 10/03]
    # 상자 안쪽 폭(29.5)은 config/places.yaml interior_m[1]이 정본이라 여기에 두지 않는다
    outer_width_cm: 32.0              # 상자 바깥 폭 (실측 기록용, 씬은 안쪽 폭 + 벽 두께로 만든다)
    side_wall_cm: 1.1                 # 상자(수납장) 벽 두께. 안쪽 폭 29.5 + 2 x 1.1 = 31.7 은 바깥 폭 32.0 과 0.3 cm 차이(측정 오차 범위) → 씬은 안쪽 폭과 벽 두께로 만든다
    cabinet_board_cm: 1.9             # 서랍장(바깥 몸체) 옆판 두께
    cabinet_side_clearance_cm: 3.2    # 서랍장 바깥 옆면 ~ 상자 바깥, 양쪽 모두. 옆판 1.9 + 레일 공간 약 1.3 [계산]
  handle:                             # 플라스틱, 앞판 가로 중앙
    width_cm: 11
    thickness_vertical_cm: 0.7        # 위아래 두께 (RG2가 위아래로 쥐는 방향 폭)
    protrusion_cm: 1.8                # [사용자 실측 10/03] 앞판 밖으로 나온 길이
    bottom_recess_cm: 0.3             # 아랫면이 0.3 cm 파여 있어 파지에 유리
    height_from_bottom_cm: {upper: 26.4, lower: 11.8}
    below_top_edge_cm: 2              # 맨 위 가장자리에서 약 2 cm 아래 (26.4와 1.1 cm 차이는 틈 때문)
    horizontal_offset_from_panel_center_cm: 0

drawer_top:                           # 위 단(2단)
  front_panel_cm: {width: 38.5, height: 14.7, thickness: 1.8}   # 두께 1.8 [사용자 도면 표시 10/03]. 가로는 사진상 본체 가로와 거의 같음 [추정], 세로 = 29.5 - 14.8
  front_bottom_height_above_seat_cm: 14.8   # 우드락 추가 전 기준. 씬에서 + riser_cm

plan_view_cm:                         # [사용자 보고, 도면] 작업대 평면도 기준, 씬 초기 배치용
  drawer_right_edge_to_table_right: 35.1      # [사용자 실측 10/03] 작업대 오른쪽 끝에서 서랍장 가까운(오른쪽) 옆면까지
  drawer_left_edge_to_table_left: 46.4        # [계산] 120 - 38.5 - 35.1
  drawer_front_to_table_edge_gap: 0           # [사용자 확인 10/03] 서랍장 본체 앞면 = 작업대 가장자리와 같은 선, 앞판 1.8 cm가 작업대 쪽으로 나옴
  robot_base_left_gap_to_table_left: 16
  robot_base_gap_to_table_top_edge: 21
  robot_base_gap_to_table_bottom_edge: 21
  robot_base_plate_cm: {width: 23, depth: 23}   # [사용자 정정 10/02] 베이스 아래 철판 크기 (도면의 23cm 두 개)
  robot_base_plate_center_from_table_left: 27.5 # [계산] 16 + 23/2. 철판 중심이며 로봇 축 위치와 같은지는 #6/URDF로 확인
  robot_base_plate_center_from_table_top: 32.5  # [계산] 21 + 23/2 (= 65/2, 깊이 방향 중앙)
  note: "로봇 베이스와 서랍의 상대 위치는 #6(3점 터치) 결과를 쓴다. 이 평면도 값은 초기 배치용."

trays:                                # staging_tray, handover_zone
  staging_tray: {size_cm: null, slots: 3}
  handover_zone: {size_cm: null, slots: 3}
