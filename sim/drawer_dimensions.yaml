# 작업대·로봇 베이스 형상 치수 (담당 A). Isaac Sim 트윈 모델링용 값 — 형상 치수는 이 파일에만 둔다.
# 측정: 캘리퍼스·줄자, 2026-10-02 [사용자 보고, 평면도 + 사진 3장]. 단위 cm (모델링 시 m로 변환).
# 서랍의 로봇 베이스 기준 위치는 #6(3점 터치, B·E)이 정본. 이 파일의 작업대 기준 위치는 씬 초기 배치용이며 #6 결과로 교체한다.
# 최대 인출 거리(max_travel_m)는 config/places.yaml(B·E)에 채운다 — 여기에는 따로 적지 않는다.
# null = 아직 측정 안 함.

table:
  width_cm: 120                       # [사용자 보고, 도면] 가로
  depth_cm: 65                        # [사용자 정정 10/02] 도면의 55는 오기. 21 + 23 + 21 = 65로 일치
  surface_height_from_floor_cm: null  # 미측정

# 서랍장(서랍 유닛)은 10/03에 철제 고정대 + 원목 서랍으로 교체하기로 해, 기존 플라스틱 서랍장의 값(외곽·단 높이·받침 선반·손잡이·인출 거리 등)을 모두 삭제했다.
# 새 서랍 설치 후 아래 drawer_unit·drawer_top·plan_view_cm.drawer_* 를 실측으로 채운다. 값이 비어 있으면 build_scene.py 는 서랍장 없이 작업대·로봇만 만든다.
# 서랍 내부 치수·최대 인출 거리·처짐은 config/places.yaml 이 정본이다.

drawer_unit:
  tiers: null
  width_cm: null                      # 작업대 변과 나란한 방향
  depth_cm: null                      # 앞면~뒷면 (닫힌 상태)
  total_height_cm: null
  seat_top_vs_table_surface_cm: null  # 받침(고정대) 윗면이 작업대 윗면보다 낮은 정도
  tier_usage: null                    # 어느 단을 어떤 프로젝트 서랍 ID(drawer_top, drawer_bottom)로 쓰는지
  handle: null                        # 형태·크기·돌출 길이·위치·파지 방향

drawer_top:
  front_panel_cm: null
  front_bottom_height_above_seat_cm: null
  max_travel_cm: null                 # 정본은 config/places.yaml 의 max_travel_m

plan_view_cm:                         # [사용자 보고, 도면] 작업대 평면도 기준, 씬 초기 배치용
  drawer_right_edge_to_table_right: null
  drawer_left_edge_to_table_left: null
  drawer_front_to_table_edge_gap: null
  robot_base_left_gap_to_table_left: 16
  robot_base_gap_to_table_top_edge: 21
  robot_base_gap_to_table_bottom_edge: 21
  robot_base_plate_cm: {width: 23, depth: 23}   # [사용자 정정 10/02] 베이스 아래 철판 크기 (도면의 23cm 두 개)
  robot_base_plate_center_from_table_left: 27.5 # [계산] 16 + 23/2. 철판 중심이며 로봇 축 위치와 같은지는 #6/URDF로 확인
  robot_base_plate_center_from_table_top: 32.5  # [계산] 21 + 23/2 (= 65/2, 깊이 방향 중앙)
  note: "로봇 베이스와 서랍의 상대 위치는 #6(3점 터치) 결과를 쓴다. 이 평면도 값은 초기 배치용."

trays:                                # staging_tray, handover_zone
  staging_tray: {size_cm: null, slots: 3}
  handover_zone: {size_cm: null, slots: 3}
