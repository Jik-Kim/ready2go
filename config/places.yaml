# 장소 좌표계 (TCP 3점 터치로 측정, 담당 B·E) [팀 확정 필요]
# bringup이 tf 블록을 읽어 static TF 발행 (결정 #23, #3·#6 합의). 키는 calibration_meta.yaml의 derived_tf와 같음.
# 단위 m, 쿼터니언 xyzw (w ≥ 0). parent = base_link (DSR 드라이버 TF 접두어 없음 [실측 10/02, #7])
drawer_top:
  tf: {parent: base_link, child: drawer_top, translation_m: null, quaternion_xyzw: null}
  # 서랍을 철제 고정대 + 원목 서랍으로 교체하기로 해(10/03) 기존 플라스틱 서랍의 값을 모두 삭제했다. 아래는 새 서랍 설치 후 실측으로 채운다 [A].
  max_travel_m: null          # 닫힘→최대 인출 앞면 이동 거리
  return_slot: null
  interior_m: [0.205, 0.295, 0.07]   # [실측 A 10/03] 서랍 내부 [깊이, 폭, 높이] m. 높이는 약 7 cm이고 여유 공간은 8 cm까지 가능. 우드락(0.5 cm)은 서랍장 바깥 아래에 깔아 내부 높이는 그대로. 서랍 내부 [깊이, 폭, 높이] m — 정본(트윈 sim/scripts/build_scene.py도 이 값을 읽음). 서랍 좌표계 원점·축 기준은 #6 3점 터치와 맞출 것 [팀 확정 필요]
  sag_m_at_max_travel: null   # 최대 인출에서 앞쪽이 처지는 양 (새 서랍은 거의 없을 수 있으나 재기 전에는 모름). 서랍 좌표계(#6 3점 터치)는 실제로 집을 때와 같은 인출 거리에서 측정할 것
drawer_bottom:                # 서랍장에서 두 번째로 쓰는 단 (서랍장 중간 단 대응은 새 서랍 기준으로 다시 확정 [E·B])
  tf: {parent: base_link, child: drawer_bottom, translation_m: null, quaternion_xyzw: null}
  max_travel_m: null
  return_slot: null
  interior_m: [0.205, 0.295, 0.07]   # 위 단과 같은 제품 [사용자 확인 가정 — 확인 필요]
  sag_m_at_max_travel: null
staging_tray:
  tf: {parent: base_link, child: staging_tray, translation_m: null, quaternion_xyzw: null}
  slots: 3
handover_zone:
  tf: {parent: base_link, child: handover_zone, translation_m: null, quaternion_xyzw: null}
  slots: 3
