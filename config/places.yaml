# 장소 좌표계 (TCP 3점 터치로 측정, 담당 B·E) [팀 확정 필요]
# bringup이 tf 블록을 읽어 static TF 발행 (결정 #23, #3·#6 합의). 키는 calibration_meta.yaml의 derived_tf와 같음.
# 단위 m, 쿼터니언 xyzw (w ≥ 0). parent = base_link (DSR 드라이버 TF 접두어 없음 [실측 10/02, #7])
# 서랍 좌표계 축 규칙 (drawer_top·drawer_bottom 공통, #6 B·PM 합의 10/04) — 이 정의가 정본. touch_frame.py·nudge 판단·비전 pose가 따른다.
#   서랍을 손잡이 쪽 정면에서 볼 때 원점 = 앞쪽 오른쪽 안쪽 바닥 모서리, x = 안쪽(깊이, interior_m[0]),
#   y = 왼쪽(폭, interior_m[1]), z = 위(높이, interior_m[2]). 오른손 좌표계. 서랍을 집을 때와 같은 인출 거리(최대)에서 측정.
#   3점 터치: P1 앞쪽 오른쪽, P2 뒤쪽 오른쪽, P3 앞쪽 왼쪽. 그리퍼 닫고 수직 아래로 테두리(옆벽 윗면) 안쪽 모서리를 찍고,
#   touch_frame.py --tip-offset-mm 10 (손끝이 TCP보다 약 10 mm 아래 [실측 B 10/03, #7]) --floor-point <바닥 한 점>
#   → 원점을 z축 따라 바닥 높이까지 내림 (PR #50).
drawer_top:
  # [실측 B 10/04] 3점 터치(최대 인출 22.5 cm, 테두리 윗면 안쪽 모서리, TCP mm): P1 [231.040, -111.779, 501.894], P2 [232.426, -311.507, 503.772],
  #   P3 [524.712, -107.647, 505.705], 바닥점 [258.525, -123.582, 434.291] → x축 ≈ base −y, y축 ≈ base +x, 두 축 사이 90.4°, 평면 기울기 약 0.9°.
  #   원점 = P1(손끝 10 mm 보정)을 z축 방향으로 바닥점 높이까지 내린 점 (테두리→바닥 68.1 mm).
  #   P1–P2 199.7 mm(두 번 측정 같음), P1–P3 293.7 mm → interior_m.
  tf: {parent: base_link, child: drawer_top, translation_m: [0.23193, -0.11241, 0.42384], quaternion_xyzw: [0.001314, -0.007931, -0.704605, 0.709555]}
  tf_at_travel_m: 0.225      # 위 tf가 유효한 인출 거리(최대 인출, 스토퍼). 닫힌 위치 원점 = 원점 + 0.225 × x축 [#6 PM 제안 10/04]
  # 서랍을 철제 고정대 + 원목 서랍으로 교체하기로 해(10/03) 기존 플라스틱 서랍의 값을 모두 삭제했다. 아래는 새 서랍 설치 후 실측으로 채운다 [A].
  max_travel_m: 0.225         # [실측 A 10/03] 닫힘→최대 인출 앞면 이동 거리 22.5 cm
  return_slot: null
  interior_m: [0.1997, 0.2937, 0.0681]   # [실측 B 10/04, 위 3점 터치] 서랍 내부 [깊이, 폭, 높이] m = P1–P2, P1–P3, 테두리→바닥. tf 원점과 같은 측정(닫힌 손끝 중심이 닿는 범위)이라 벽 경계와 원점이 같은 기준 (PR #56 리뷰). 이전 값 [0.205, 0.295, 0.07] [실측 A 10/03]. 높이 = 상자 바닥~옆벽 윗면. 우드락(0.5 cm)은 서랍장 바깥 아래에 깔아 내부 높이는 그대로. 정본(트윈 sim/scripts/build_scene.py도 이 값을 읽음)
  interior_clearance_height_m: 0.08   # [사용자 확인 10/03] 상자 바닥~위쪽 판까지 실제 여유(손가락·손목이 걸리지 않는 높이)
  sag_m_at_max_travel: 0.0     # [사용자 확인 A 10/03] 최대 인출에서 처짐 없음. 서랍 좌표계(#6 3점 터치)는 실제로 집을 때와 같은 인출 거리에서 측정할 것
drawer_bottom:                # 서랍장 아래 단 [사용자 확인 10/03: 위 단 = drawer_top, 아래 단 = drawer_bottom]
  tf: {parent: base_link, child: drawer_bottom, translation_m: null, quaternion_xyzw: null}
  max_travel_m: 0.225   # [실측 A 10/03] 닫힘→최대 인출 22.5 cm (두 서랍 동일 제품 가정)
  return_slot: null
  interior_m: [0.205, 0.295, 0.07]   # 위 단과 같은 제품 [사용자 확인 10/03]. 아직 3점 터치 전 — P3에서 터치로 갱신
  interior_clearance_height_m: null  # 1단은 위가 2단 상자 바닥까지 열려 있어(중간 가로막 없음) 8 cm가 아님. 미측정
  sag_m_at_max_travel: 0.0   # [사용자 확인 A 10/03] 처짐 없음 (위 단과 같은 제품)
staging_tray:
  tf: {parent: base_link, child: staging_tray, translation_m: null, quaternion_xyzw: null}
  slots: 3
handover_zone:
  tf: {parent: base_link, child: handover_zone, translation_m: null, quaternion_xyzw: null}
  slots: 3
