# 장소 좌표계 (TCP 3점 터치로 측정, 담당 B·E) [팀 확정 필요]
# bringup이 tf 블록을 읽어 static TF 발행 (결정 #23, #3·#6 합의). 키는 calibration_meta.yaml의 derived_tf와 같음.
# 단위 m, 쿼터니언 xyzw (w ≥ 0). parent = base_link (DSR 드라이버 TF 접두어 없음 [실측 10/02, #7])
# 서랍 좌표계 축 규칙 (drawer_top·drawer_bottom 공통, #6 B·PM 합의 10/04) — 이 정의가 정본. touch_frame.py·nudge 판단·비전 pose가 따른다.
#   서랍을 손잡이 쪽 정면에서 볼 때 원점 = 앞쪽 오른쪽 안쪽 바닥 모서리, x = 안쪽(깊이, interior_m[0]),
#   y = 왼쪽(폭, interior_m[1]), z = 위(높이, interior_m[2]). 오른손 좌표계. 서랍을 집을 때와 같은 인출 거리(최대)에서 측정.
#   3점 터치: P1 앞쪽 오른쪽, P2 뒤쪽 오른쪽, P3 앞쪽 왼쪽. 그리퍼 닫고 수직 아래로 테두리(옆벽 윗면) 안쪽 모서리를 찍고,
#   touch_frame.py --tip-offset-mm 10 (손끝이 TCP보다 약 10 mm 아래 [실측 B 10/03, #7]) --floor-point <바닥 한 점>
#   → 원점을 z축 따라 바닥 높이까지 내림 (PR #50).
drawer_top:
  # [실측 B 10/04] 3점 터치(최대 인출 22.5 cm, 테두리 윗면 안쪽 모서리, TCP mm): P1 [231.040, -111.779, 273.894], P2 [232.426, -311.507, 275.772],
  #   P3 [524.712, -107.647, 277.705], 바닥점 [258.525, -123.582, 206.291] → x축 ≈ base −y, y축 ≈ base +x, 두 축 사이 90.4°, 평면 기울기 약 0.9°.
  #   측정 당시 펜던트 툴 설정(TCP GripperDA_v1, tool_weight)이 풀려 플랜지 기준으로 읽혀, 읽은 z에서 228 mm를 뺀 값이다(4점 모두 툴 수직 아래 Ry ≈ 180°라 x·y 영향 없음, #6 A 지적).
  #   검증 [실측 B 10/04, 툴 설정 복구 후 재터치]: P1 [229.006, -111.953, 272.872], 바닥점 [257.348, -124.319, 204.496] → 위 값과 각각 2.3 mm 차이.
  #   원점 = P1(손끝 10 mm 보정)을 z축 방향으로 바닥점 높이까지 내린 점 (테두리→바닥 68.1 mm).
  #   P1–P2 199.7 mm(두 번 측정 같음), P1–P3 293.7 mm → interior_m.
  # [실측 B 10/06] 바닥 직접 터치(닫은 손끝 수직, 힘 감지 즉시 멈춤)로 원점 높이 보정: 바닥이 옛 원점보다 약 3 mm 낮음 → 원점을 서랍 z축으로 −3.0 mm.
  #   바닥 TCP(mm) P1 손잡이·로봇 쪽 [263.333, -120.099, 202.540], P2 서동권·로봇 쪽 [267.058, -300.496, 205.119],
  #   P3 손잡이·오른쪽 [508.909, -118.738, 207.577], P4 가운데 [380.910, -211.529, 204.981] → 옛 좌표계 바닥 −3.8 / −2.9 / −2.0 / −3.7 mm (평균 −3.1, 기울기 0.4° 이하라 무시).
  #   검산: 안쪽 모서리 세로 지우개 윗면 터치 [522.426, -287.072, 219.211] → 새 좌표계 윗면 10.9 mm (지우개 11.5 mm, 차이 0.6 mm).
  #   손잡이 쪽은 누르면 처짐: 보통 터치 −5.0 / −5.5 mm → 살짝 터치 −3.8 / −2.0 mm (최대 3.5 mm, 아래 sag 참고).
  tf: {parent: base_link, child: drawer_top, translation_m: [0.23197, -0.11244, 0.19284], quaternion_xyzw: [0.001314, -0.007931, -0.704605, 0.709555]}
  tf_at_travel_m: 0.226      # 위 tf가 유효한 인출 거리(최대 인출, 스토퍼). 닫힌 위치 원점 = 원점 + 0.226 × x축 [#6 PM 제안 10/04, 값은 아래 max_travel_m 로봇 실측]
  # 서랍을 철제 고정대 + 원목 서랍으로 교체하기로 해(10/03) 기존 플라스틱 서랍의 값을 모두 삭제했다. 아래는 새 서랍 설치 후 실측으로 채운다 [A].
  max_travel_m: 0.226         # [실측 B 10/04] 손잡이를 잡은 채 닫힘→스토퍼까지 로봇으로 끌어 연 TCP 이동 226.3 mm (x·z 변화 0.2 mm 이내, poses.yaml drawer_approach 주석). 이전 [실측 A 10/03] 줄자 22.5 cm
  return_slot: null
  interior_m: [0.1997, 0.2937, 0.0711]   # [실측 B 10/04, 위 3점 터치; 높이는 10/06 바닥 보정 +3.0 mm] 서랍 내부 [깊이, 폭, 높이] m = P1–P2, P1–P3, 테두리→바닥. tf 원점과 같은 측정(닫힌 손끝 중심이 닿는 범위)이라 벽 경계와 원점이 같은 기준 (PR #56 리뷰). 이전 값 [0.205, 0.295, 0.07] [실측 A 10/03]. 높이 = 상자 바닥~옆벽 윗면. 우드락(0.5 cm)은 서랍장 바깥 아래에 깔아 내부 높이는 그대로. 정본(트윈 sim/scripts/build_scene.py도 이 값을 읽음)
  interior_clearance_height_m: 0.08   # [사용자 확인 10/03] 상자 바닥~위쪽 판까지 실제 여유(손가락·손목이 걸리지 않는 높이)
  sag_m_at_max_travel: 0.0     # [사용자 확인 A 10/03] 최대 인출에서 처짐 없음(무부하). [실측 B 10/06] 손잡이 쪽 바닥 모서리를 손끝으로 누르면 최대 3.5 mm 처짐(살짝 터치와 보통 터치 차이). 서랍 좌표계(#6 3점 터치)는 실제로 집을 때와 같은 인출 거리에서 측정할 것
drawer_bottom:                # 서랍장 아래 단 [사용자 확인 10/03: 위 단 = drawer_top, 아래 단 = drawer_bottom]
  tf: {parent: base_link, child: drawer_bottom, translation_m: [0.24032, -0.11340, 0.04701], quaternion_xyzw: [-0.002992, -0.004652, -0.702478, 0.711684]}
  # [실측 B 10/07, 끝까지 연 상태] 원점 = 손잡이 쪽 왼쪽(로봇 쪽) 바닥 모서리, x = 안쪽(base −y), y = 오른쪽(base +x), z = 위.
  #   y = 테두리 P1→P3 를 바닥 평면에 투영, z = 바닥 4점(F1~F4) 평면 법선 (바닥 기울기 0.63°, 점 오차 ±0.8 mm), 테두리→바닥 68.9 mm.
  #   점 목록 practice/B/2026-10-07_practice.md "아래 서랍 실측". 손끝 = TCP − 10 mm.
  #   확인 [실측 PC2 10/08, #155]: 하단 180° 탑뷰 비전 vs 손끝 정답 지우개 위치 오차 2.5 mm(3회 0.1 mm 안), 비전 바닥 z 중앙값 2.0 mm.
  #   테두리 모서리 다시 재기 x 1 mm·y −3 mm 차이 (서랍 좌우 유격 또는 손목 방향 차이, 미구분).
  max_travel_m: 0.226   # 위 단과 같은 제품 [추정] — 위 단 로봇 실측 값. P3에서 확인
  return_slot: null
  interior_m: [0.1997, 0.2937, 0.0681]   # 위 단과 같은 제품 [사용자 확인 10/03] → 위 단 3점 터치 값을 같은 기준으로 사용 (#6 A 제안·B 답변 10/04). P3에서 3점 터치로 확인
  interior_clearance_height_m: null  # 1단은 위가 2단 상자 바닥까지 열려 있어(중간 가로막 없음) 8 cm가 아님. 미측정
  sag_m_at_max_travel: 0.0   # [사용자 확인 A 10/03] 처짐 없음 (위 단과 같은 제품)
staging_tray:
  tf: {parent: base_link, child: staging_tray, translation_m: null, quaternion_xyzw: null}
  slots: 3
handover_zone:                # 전달트레이 (위로 갈수록 넓어지는 사다리꼴 — 기준은 바닥). 축 규칙은 서랍과 같음: 로봇 쪽에서 볼 때
  #   원점 = 앞쪽(로봇 쪽) 오른쪽(서동권 자리 쪽, −y) 바닥 모서리, x = 로봇에서 멀어지는 쪽(≈ base +x), y = 왼쪽(≈ base +y), z = 위.
  #   트레이는 긴 쪽을 x로 놓음 (평소 그리퍼 자세 = 손가락 base ±x로 닫힘 → 손목 회전 없이 놓기, 카메라 화면 가로와 맞춤).
  #   트레이는 고정하지 않은 임시 위치 — 몇 mm 밀릴 수 있음 [사용자 확인 B 10/05].
  # [실측 B 10/05] 바닥 직접 터치(닫힌 손끝, 수직 아래, 한쪽 벽에 붙여 모서리 쪽으로 밀어 멈춘 곳, TCP mm):
  #   P1 [556.948, 160.222, 13.539], P2 [691.128, 161.847, 13.723], P3 [553.354, 250.496, 14.158]
  #   → touch_frame.py --tip-offset-mm 10 (바닥을 직접 찍어 --floor-point 없음). x축 base +x와 0.7°, 두 축 사이 91.6°, 평면 기울기 0.4°.
  #   점검: 가운데 점 [622.734, 206.251, 12.782] → 좌표계 (66.3, 45.2, −1.2) mm = 바닥 중심(67.1, 45.2)과 1 mm 이내.
  #   P2 반복 터치 0.3 mm 차이. 크기는 닫힌 손끝 중심이 닿는 범위라 그리퍼 방향에 따라 다름(손가락이 닫힘 방향으로 더 두꺼움) — 이 값은 평소 자세 기준.
  tf: {parent: base_link, child: handover_zone, translation_m: [0.55695, 0.16022, 0.00354], quaternion_xyzw: [0.003450, -0.000665, 0.006057, 0.999975]}
  interior_m: [0.1342, 0.0903, 0.043]   # [실측 B 10/05, 위 터치] 바닥 [깊이, 폭, 높이] m = P1–P2, P1–P3 (닫힌 손끝 중심이 닿는 범위), 바닥→테두리 윗면.
  #   테두리: 서동권 쪽 벽 가운데 윗면 터치 TCP [626.413, 144.945, 56.518] → 좌표계 (69.3, −15.8, 43.0) mm (벽 윗면 중심이 바닥 끝에서 바깥으로 약 16 mm).
  slots: 3                      # 긴 쪽(x)으로 3칸 → 칸마다 x 45 × y 90 mm. 물건 긴 변을 y로 놓음 (pick_plan.slot_centers, 스킬 서버 place_object)
