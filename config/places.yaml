  # [실측 B 10/10 PC2 다시 교시] 테두리 안쪽 모서리 3점(닫은 손끝 수직, TCP mm): t1 [237.587, -114.643, 275.285], t2 [237.524, -324.161, 277.423]·[238.908, -324.856, 277.875] (평균, 본체에 닿아 더 못 감),
