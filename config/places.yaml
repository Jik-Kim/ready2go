  #   P3 손잡이·오른쪽 [508.909, -118.738, 207.577], P4 가운데 [380.910, -211.529, 204.981] → 옛 좌표계 바닥 −3.8 / −2.9 / −2.0 / −3.7 mm (평균 −3.1, 기울기 0.4° 이하라 무시).
