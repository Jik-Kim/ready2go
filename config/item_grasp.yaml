# grip_force 단위 N. 임의 기본 힘을 넣지 않는다. [팀 확정 필요]
# verified는 장소·자세·반복성·힘을 포함한 B·E의 파지 승인 후에만 true.
# 단일 성공 보고는 최종 승인과 다르다. 목록 등록·라벨링은 verified와 별개.
# grasp_width_m / grasp_width_long_m (선택, m): RG2 로 실제로 잡은 폭 — world size_m 외접 박스와 다른 물품만 [B 실측]. 짧은 변 잡기 / 긴 변 양끝 잡기.
