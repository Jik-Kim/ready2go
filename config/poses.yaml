# 기준 포즈 (직접교시로 측정, 담당 B 서동권) — 관절각 [deg] [팀 확정 필요]
# Phase 1: home, drawer_top용 포즈, tray_view
home:              {joints_deg: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]}   # [실측 10/03, B] 수업 홈 자세
drawer_approach:   {drawer_top: [22.08, 20.928, 111.886, 105.463, -106.194, -45.033], drawer_bottom: null}     # drawer_bottom: 교시 전 (P1 시연은 위 서랍만, 구현은 공통)
  # [실측·계산 B 10/04] 위 서랍 손잡이 정면 10.8 cm 앞 (TCP ≈ [382.7, -184.5, 268.5] mm, 그리퍼 수평 -y). 손잡이 파지 자세에서 +y로 108 mm 물린 자세를 IK로 계산.
  #   여기서 -y로 직선 108 mm 들어가면 손잡이 파지 (경로 관절 연속 확인). alias ready와 같은 값.
  #   손잡이 파지 (서랍 닫힘) posj [7.151, 17.707, 116.751, 95.071, -95.287, -45.349], TCP [382.695, -292.476, 268.505] [실측 B 10/04, #13]
  #   손잡이 파지 (최대 인출, 잡은 채 끌어 엶) posj [35.43, 27.553, 101.309, 114.113, -117.004, -45.309], TCP [382.918, -66.2, 268.44] → 인출 226.3 mm, x·z 변화 0.2 mm 이내 [실측 B 10/04, #13]
drawer_top_view:   {drawer_top: [-35.473, 36.888, 10.267, -0.191, 132.849, -35.490], drawer_bottom: null}
  # [실측 B 10/04] 최대 인출 상태에서 그리퍼 수직 아래(Ry 179.995°), TCP [424.181, -294.601, 363.507] mm. 서랍 네 벽이 화면에 모두 들어옴.
  #   계산: 카메라 광축이 서랍 바닥 가운데에서 깊이 4 mm·폭 9 mm 지점, 카메라 높이 바닥 위 약 371 mm (calibration_meta.yaml 손목 카메라 TF).
  #   주의: drawer_approach와 J1이 약 58° 차이 — 두 자세 사이 관절 이동 첫 실행은 저속으로 서랍장 간섭 확인.
tray_view:         {joints_deg: [9.825, 49.081, 33.632, -0.128, 97.300, 9.753]}
  # [실측 B 10/05] 전달트레이를 x축으로 길게 돌려 놓은 뒤(손목 회전 없이 놓기·카메라 가로와 맞춤) 교시. 그리퍼 수직 아래(Ry 179.971°),
  #   TCP [663.515, 121.909, 100.147] mm. 처음 교시(z 53.6)는 손끝이 트레이 테두리 윗면보다 2.8 mm 낮아 z 100으로 올림
