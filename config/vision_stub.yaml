# inspect_region stub 용 서랍 안 물체 좌표 (담당 A, #18 Day 4 stub — B #15 실물 테스트용)
# 사람이 직접 잰 값을 넣는다. 아래 값은 자리표시자 [추정]이므로 실물 테스트 전에 B와 함께 덮어쓰고, 그 뒤에 ready 를 true 로 바꿀 것.
# pose.frame 은 서랍 좌표계, 단위 m·rad. 정의(원점·축)는 config/places.yaml 첫 부분과 #6 (B 확정):
#   원점 = 위 서랍(drawer_top) 상자 안쪽 바닥 앞쪽 오른쪽 모서리(손잡이 정면에서 볼 때), x = 안쪽(뒤, 깊이), y = 왼쪽(폭), z = 위. 서랍이 나오는 방향은 -x.
#   그래서 position 의 x·y 범위는 0 ~ places.yaml drawer_top.interior_m 의 [깊이, 폭] (손끝이 닿는 범위, 수치를 여기에 복사하지 않는다). yaw 는 물체 긴 변 방향(서랍 x축 기준 rad, size_m[0] = 긴 변).
# top_z: 서랍 바닥 기준 물체 윗면 높이(m). candidates 는 이 값 내림차순으로 반환된다.
# ready: 실측 좌표로 교체했을 때만 true 로 바꾼다. false 이면 서비스가 STUB_NOT_READY 로 실패해
# 자리표시자 좌표가 로봇 동작의 입력이 되지 않는다 (PR #33 리뷰).
ready: false
regions:
  drawer_top:
    objects:
      - {class: lip_balm, position: [0.10, 0.08, 0.0], yaw: 0.0, top_z: 0.0202}   # 높이는 이슈 #8 실측(지름 20.2), 위치는 자리표시자
      - {class: car_key,  position: [0.10, 0.18, 0.0], yaw: 0.0, top_z: 0.0158}
      - {class: eraser,   position: [0.18, 0.13, 0.0], yaw: 0.0, top_z: 0.0115}
  staging_tray: {objects: []}
  handover_zone: {objects: []}
