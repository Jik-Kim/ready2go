# inspect_region V2(뎁스 덩어리) 임계값 (담당 A). 코드에 상수로 두지 않고 여기서 읽는다.
# 전부 [팀 확정 필요] 초기값 [추정] — 실물 촬영·시험(#14, B #15)으로 조정한다.
depth_blob:
  mask_erode_px: 2             # 분할 모델 마스크를 이만큼 깎은 안쪽 뎁스만 쓴다(경계의 옆 물체·벽 뎁스 번짐 제외). 박스 모델은 영향 없음 (#109, 10/07 masktz 5x5)
  floor_margin_m: 0.007        # 서랍 바닥(z=0)보다 이만큼 높은 뎁스 픽셀만 물체 후보. 가장 얇은 지우개 11.5 mm 보다 충분히 작게.
                               # 0.004 → 0.007 (10/06): #83 원점 −3 mm 뒤 카메라로 본 바닥이 약 +3 mm 라 4 mm 면 바닥 일부가 덩어리에 섞여
                               # yaw 가 9° 틀어짐 [s91_val_b 덤프 재계산]. 7 mm 는 옛·새 원점 모두 yaw 차이 0.3° 이내
  min_depth_m: 0.15            # D435i 최소 거리 근처 이하는 결손으로 본다
  max_depth_m: 1.0
  roi_margin_px: 4             # YOLO 박스를 이만큼 넓혀 윤곽이 잘리지 않게
  max_invalid_ratio: 0.5       # 박스 안 결손 비율이 이보다 크면 DEPTH_INVALID
  min_valid_px: 50             # 유효 뎁스 픽셀이 이보다 적으면 DEPTH_INVALID
  min_blob_px: 40              # 덩어리가 이보다 작으면 yaw_valid=false
  top_percentile: 95           # top_z = 덩어리 높이의 백분위 (이상치 완충)
  top_exclude_near_px: 15      # [추정 10/13] 분할 모델: top_z 를 잴 때 자기 높이 중앙값보다 top_exclude_min_dz_m 이상 높은 이웃(결과에 남은 검출) 마스크에서
                               # 이 거리(px) 안 픽셀은 뺀다 — 마스크 가장자리가 높은 이웃에 걸쳐 p95 가 튐(10/12 판 밑 지우개 25.8 mm, 실제 11.5).
                               # 0 이면 끔(이전과 같음). 가림 판정 전체 윗면(occlusion max_over_lower_m·fallback_cover_min_m)도 같은 마스크, position x·y 는 새 top_z/2 로 다시 투영
  top_exclude_min_dz_m: 0.004  # [추정 10/13] 위 '높은 이웃' 기준. occlusion.max_over_lower_m(4 mm)과 값만 같고 뜻은 다름(이웃 고르기 vs 관계 버리기)
                               # 덜어낸 윗면은 min(원래 값, 온톨로지 높이 size_m z) 아래로 낮추지 않음 — 검은 립밤 뎁스가 낮게 잡혀 15.9 mm 까지 내려감(10/07 판 밑) [실측 PC1 덤프 158장 10/13]
  min_short_side_m: 0.008      # 덩어리 짧은 변이 이보다 얇으면 yaw_valid=false
  size_tolerance: 0.5          # 덩어리 긴 변이 명목 긴 변의 ±50% 를 벗어나면 yaw_valid=false (겹침·병합 의심)
  fragment_min_area_ratio: 0.05  # 마스크가 이 넓이 비율 이상 조각 2개 이상으로 갈라졌고 가장 큰 덩어리가 길이 검사에 떨어지면 조각 전체 외접 사각형으로 yaw (위에 얹힌 물체에 가운데가 덮인 몽키, 10/14 S1). 0 = 끔(예전 동작) [팀 확정 필요]
  fragment_min_px: 50            # 위 조각 계산에 쓸 마스크 픽셀 최소 수
  fragment_size_tolerance: 0.2   # 위 조각 외접 사각형의 긴 변은 명목 ±20%, 짧은 변은 명목 × 1.2 이하일 때만 yaw_valid=true — 방향이 틀린 채 true 가 되지 않게 size_tolerance 보다 좁게 [실측: 몽키 19장 긴 변 169~175 mm(명목 170), 짧은 변 56~63 mm(명목 61)] [팀 확정 필요]
region:
  edge_tolerance_m: 0.015      # 물체 footprint 가 서랍 내부 경계 밖으로 이만큼까지는 측정 오차로 보고 허용 [추정]. 넘으면 결과에서 제외
                               # 0.01 → 0.015 (10/06, AC-VIS-01 1.5 cm와 같게): 벽면 배치(P1 사용자 결정) 실측 지우개 [0.1769, 0.2895] yaw 0 은
                               # footprint 가 interior_m 보다 x 3.4 mm·y 6.8 mm 밖으로 계산돼(#22 E 값), 0.01 이면 비전 오차 3 mm 로 제외될 수 있음
                               # 영향: 서랍 밖으로 최대 15 mm 나간 footprint 도 결과(target·candidates → nudge·pick 입력)에 들어간다 [추정: 서랍 벽 두께·테두리 위 물체는
                               # 이보다 멀어 제외될 것]. 벽 붙임 시험(#22·#23 10/07~08)으로 실측 footprint 초과량을 확인한 뒤 0.01 환원을 검토한다
                               # **이 값은 비전 측정 오차 허용이지 모션 안전 경계가 아니다.** 벽에 붙은 물체는 이 값과 무관하게 정상 target 이 되므로
                               # 그리퍼 벽 간섭은 B 스킬(끌기 plan_drag·_grasp_blocked, pick 사전 검사)이 판단한다 (D 재검토 P1 #80, 10/06)
  mask_footprint_trim_pct: 1.0 # 분할 모델 footprint(보이는 마스크를 바닥에 투영한 범위)에서 양 끝 이만큼(%)은 마스크 가장자리 잡음으로 보고 뺌 [추정 10/12]
                               # 이유: 명목 크기를 보이는 중심에 놓으면 일부 가려진 긴 물체가 벽 밖으로 계산돼 빠졌다(10/12 PC2 3단 쌓기 몽키 conf 0.94, 10/08 망치 0.92)
  detect_roi_margin_m: 0.025  # 서랍 영역 ROI: 박스 중심을 서랍 바닥에 투영한 점이 서랍 안쪽 + 이 값 밖이면 뎁스 계산 전에 제외 [추정, 10/07]
                               # 이유: PC2 실물에서 서랍 밖 책상 위 케이블을 caramel_box 0.38 로 검출 → 바닥보다 낮아 뎁스 실패 → 호출 전체 DEPTH_INVALID
                               # (inspect_20261007_105841_474Z). 실물 덤프 59장: 서랍 안 결과 물체의 투영 초과 최대 3.3 mm(벽 붙은 립밤),
                               # 그리퍼 손끝 자리(목표와 같은 eraser 로 0.39 오검출된 적 있음) 36~46 mm, 책상 위 케이블·화면 끝 95 mm 이상 [실측 10/07]
                               # → 0.025 (처음 0.04 는 그리퍼 손끝 36 mm 를 통과시켜 PM 검토로 낮춤). 그 뒤 footprint 검사(edge_tolerance_m)는 그대로
  visible_min_ratio: 0.80      # 관측 유효성 (#43): 지역 바닥 격자점 중 보인 비율이 이보다 작으면 REGION_NOT_VISIBLE [팀 확정 필요]
                               # [실측 PC1 덤프 97장 재계산 10/11] 정상 촬영(위·아래 칸) 0.94~1.00(중앙값 0.98). 실패로 남은 2장만 기준 미만(원래 DEPTH_INVALID → REGION_NOT_VISIBLE, 나머지 95장 결과 그대로):
                               #   10/07 094527 0.55 — 카메라 케이블이 렌즈 앞(화면 39% 뎁스 결손, 10/07 A practice), 지금은 케이블 정리됨 [사용자 10/11]
                               #   10/08 015707 0.003 — 아래 칸을 찍고 drawer_top 으로 호출(바닥이 위 칸 좌표 z −146 mm, practice/B 10/08)
  visible_step_m: 0.005        # 바닥 격자 간격
  visible_wall_margin_m: 0.01  # 벽에서 이만큼 안쪽 격자만 (벽 면 뎁스 섞임 제외)
  visible_z_min_m: -0.008      # 보인 점의 지역 z 하한 (바닥 아래로 이만큼까지는 뎁스 오차)
  visible_z_max_m: 0.07        # 지역 높이(interior_m[2])를 모를 때 z 상한. 아는 지역은 그 높이(서랍 테두리·트레이 테두리)
  visible_object_z_max_m: 0.045  # 검출 마스크 밖 점은 이 높이까지만 '보임'(바닥·낮은 물체) — 온톨로지 최고 물체 cover_plate 40.5 mm + 5 mm [팀 확정 필요]
                               # 이유: 테두리에 걸친 종이·트레이 안 손은 z 40~70 mm 라 벽 높이(60 mm)까지 세면 보인 것으로 잡혔다
                               # [실측 PC1 tray_view 10/11] 종이 절반 0.866·0.909, 손 0.829 → 이 값으로 0.573·0.335·0.778 (오류).
                               # 실물 덤프 117장(위·아래 칸·트레이) 재계산: 결과가 바뀐 것은 이 3장뿐, 나머지 비율 그대로(정상 최저 0.941, 트레이 물건 4개 0.944)
                               # 한계: 바닥에 붙인 손바닥처럼 낮은 면은 높이로 구분 못 함. 검출 안 된 45 mm 넘는 물체가 넓으면 오류로 나올 수 있음
                               #   마스크(박스) 안은 벽 높이까지 세므로 손·종이가 물체로 오검출되면 그 자리는 가림으로 안 잡힘 (휴대폰 → toy_wrench 0.35 사례, 10/11)
detector:
  conf_min: 0.25               # 이보다 낮은 검출은 버린다
dedup:
  min_overlap: 0.6             # 분할 모델: 같은 클래스 두 검출의 마스크 겹친 넓이 / 작은 쪽 넓이가 이 이상이면 같은 물체로 합침 [팀 확정 필요]. 박스 모델은 병합 안 함 (#109)
occlusion:                     # 가림 판정 (P2, #109 4단계, core/occlusion.py). 분할 모델일 때만 쓴다 [팀 확정 필요]
                               # 값 출처: PC1 덤프 69장 시험 코드(~/yolo_run/occl, 10/08) — 이 표본으로 정한 값이라 AC-VIS-02 근거 아님(requirements #occlusion-policy)
  contact_dilate_px: 12        # 두 마스크를 이만큼 넓혀 겹치면 맞닿음
  min_contact_px: 15           # 맞닿은 띠 픽셀이 양쪽 다 이 이상
  min_height_diff_m: 0.004     # 맞닿은 띠 높이 중앙값 차이가 이 이상이면 높은 쪽이 위 (얇은 덮개 밑은 못 봄)
  max_over_lower_m: 0.004      # 위로 판정된 물체의 전체 윗면(마스크 z 95 백분위)이 아래 물체보다 이만큼 넘게 낮으면 그 관계는 버림 [팀 확정 필요]
                               # 이유: 띠가 상자 가장자리면 뎁스가 바닥과 섞여 띠 높이가 뒤집힘 — 10/12 PC2 024941 캐러멜 띠 6.5 mm(윗면 37)라
                               # 몽키(윗면 16.6)가 '캐러멜 위'로 나옴 [실측]. 분할 덤프 49장에서 바뀌는 것은 그 1장뿐(0~8 mm 같음, B 제안 #235)
  fallback_cover_min_m: 0.010  # 보조: 덜 보이는데 덮은 물체를 못 찾으면, 맞닿은 이웃 중 전체 윗면이 이만큼 이상 높은 것이 하나뿐일 때 그것이 덮은 물체 [팀 확정 필요]
                               # 이유: 얇은 판이 바로 위를 덮으면 띠 높이 차가 2 mm(10/12 PC2 아래 칸 립밤, 판 22.3 · 립밤 20.3)라 위 기준(4 mm)에 안 걸려 null.
                               # [실측: 분할 덤프 47장] 6 mm 6장·8 mm 4장·10 mm 3장이 null → 덮개, 모두 정답(헛관계 0). 10 mm 는 지우개(11.5) 옆에
                               # 닿기만 한 립밤(20, 차 8.5)을 덮은 물체로 잡지 않으려고 고름 — 10/11 오전 지우개 2장은 null 로 남음
                               # max_over_lower_m·fallback_cover_min_m 은 조정 표본(위 덤프)으로 정한 값 — AC-VIS-02 평가 근거 아님. 평가 장면에
                               # "덜 보이는 물체 옆에 키 큰 물체가 닿기만 한 배치"(헛관계 여유 1.5 mm) 를 넣을 것 [PM #236 검토]
  visible_ratio_max: 0.80      # 보이는 넓이 / 클래스 기준 넓이가 이보다 작으면 '덜 보임'
  alone_clear_min_ratio: 0.70  # 덜 보이는데 맞닿은 검출 물체가 하나도 없고 마스크가 안 갈라졌으면, 비율이 이 이상일 때 [] (덮을 물체 없음). 이보다 작으면(절반 이상 가려짐) 그대로 null. 없으면 끔 [팀 확정 필요]
                               # [실측: 실물 덤프 119장 재계산] 바뀌는 것은 10/14 PC2 아래 칸 혼자 다 보인 지우개 6장(0.775~0.794)뿐. #360 은 판 미검출 대비로 0.77 이었으나 아래 ring_check 가 그 역할을 해 0.70 으로 되돌림(10/15)
  ring_check: true             # 위 '혼자' 규칙 전에 마스크 둘레 뎁스 확인: 둘레 띠(다른 검출 마스크·서랍 벽 쪽 제외)에 자기 윗면보다 ring_high_dz_m 이상 높은 픽셀이
                               # ring_high_min_px 이상이면 검출 안 된 물체가 덮었을 수 있어 null 유지 [팀 확정 필요]. [실측: 실물 덤프 119장 + 10/11 판 검출 뺀 재계산 10/14]
                               # 오늘 혼자 지우개 6장 높은 픽셀 0(둘레 약 9000), 판 검출 뺀 10/11 판 밑 지우개 3장 1182~2582 → 결과 변화 0, 판 미검출도 null(#196 PM 검토)
                               # 하한 0.70 에서는 판 미검출의 유일한 방어. 둘레 띠가 비거나 윗면을 못 재면 null. ring_* 값은 이 표본에서 정함 — AC-VIS-02 근거 아님
  ring_inner_px: 4              # 둘레 띠 안쪽 경계: 마스크를 이만큼 넓힌 곳부터 (마스크 가장자리에 섞인 자기 윗면 제외)
  ring_outer_px: 24             # 둘레 띠 바깥 경계 (1280x720, 37 cm 에서 약 1 cm)
  ring_high_dz_m: 0.004         # 자기 윗면보다 이만큼 이상 높으면 '높은 픽셀' (min_height_diff_m 과 같은 4 mm)
  ring_high_min_px: 30          # 높은 픽셀이 이 이상이면 null 유지 (뎁스 잡음 점 무시)
  ring_wall_margin_m: 0.004     # 서랍 안쪽 경계에서 이만큼 안쪽 픽셀만 (벽면 제외)
  split_min_px: 300            # 마스크 조각을 셀 때 이보다 작은 조각은 무시 (1280x720 기준)
  ref_visible_area_m2:         # 클래스별 다 보일 때 넓이 = 69장 visible_area_m2 의 90 백분위 [실측 PC1 10/08]. 없는 클래스(carrot_pen)는 '덜 보임' 판정 불가 → 위 물체가 맞닿으면 모름
    airpods_case: 0.002583
    car_key: 0.002678
    caramel_box: 0.003451
    cover_plate: 0.006786
    eraser: 0.001443
    lip_balm: 0.001653
    masking_tape: 0.001306
    toy_car: 0.001839
    toy_hammer: 0.004818
    toy_wrench: 0.005013
policy:
  on_invalid_candidate: fail   # fail: 뎁스가 쓸 수 없는 검출이 하나라도 있으면 전체 DEPTH_INVALID (안전 우선) / skip: 그 검출만 제외
floor_probe:                   # 진단 로그 전용 (결과에 쓰지 않음): 카메라로 본 서랍 바닥 z. #83 원점 −3 mm 뒤 카메라·터치 약 3 mm 차이 원인 확인용
  stride_px: 4                 # 표본 간격(픽셀)
  wall_margin_m: 0.02          # 벽·모서리에서 이만큼 안쪽만 (벽면 뎁스 섞임 방지)
  max_abs_z_m: 0.008           # |z| 가 이보다 큰 점은 바닥이 아님(물체·벽). 지우개 11.5 mm 보다 작게
  box_margin_px: 10            # 검출 박스를 이만큼 넓혀 제외
  min_depth_m: 0.15
  max_depth_m: 1.0
