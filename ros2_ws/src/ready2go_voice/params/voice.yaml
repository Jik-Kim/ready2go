# 아래 값은 시운전 제안이며 [팀 확정 필요]. 장치/API/지연을 실측해 확정합니다.
ontology_file: /knowledge/robot_ontology.jsonld
intent_schema_file: /contracts/intent.schema.json
evaluation_mode: false # 사용자 확정 기본 실행 모드. ROS -p evaluation_mode:=true는 모든 intent 발행 차단.
audio_enabled: false  # 장치/모델 준비 후 true. text_override는 음성 평가를 대체하지 않음.
input_device: null    # [팀 확정 필요] PortAudio 장치 번호 또는 이름, null은 시스템 기본값
output_device: null   # [팀 확정 필요]
wake_model: /home/jonny/corecode/VoiceProcessing/hello_rokey_8332_32.tflite # 원본 읽기만, 배포 경로 확인 필요
wake_threshold: 0.7 # 사용자 확정; 감지는 점수 > threshold
sample_rate: 16000
frame_samples: 1280
speech_rms: 350       # int16 RMS [팀 확정 필요]
silence_sec: 0.4      # [팀 확정 필요] 발화 종료 지연도 3초 측정에 포함
speech_start_timeout_sec: 3.0
max_record_sec: 8.0   # 최대 보호 한도이며 고정 8초 녹음이 아님
stt_model: whisper-1
llm_model: gpt-4o     # 참고 코드 후보, 계정 접근·실측 지연 [팀 확정 필요]
stt_timeout_sec: 30.0
llm_timeout_sec: 30.0
confirmation_budget_sec: 3.0
tts_reserve_sec: 0.7
min_confidence: 0.85
bare_item_policy: clarify # 사용자 확정: 대상 단독/모호 요청은 clarify. unknown 설정은 거절.
tts_executable: espeak-ng
tts_voice: ko        # 한국어 설치/명료도 [팀 확정 필요]
tts_speed: 180
tts_timeout_sec: 20.0 # Melo CPU 시운전 상한 [팀 확정 필요], AC start_deadline은 별도 유지
# C 계약07 수락/speak 첫 동작 게이트 구현과 직접 ROS 연결 확인 후 명시 opt-in.
request_run_enabled: false
confirmation_enabled: true # C 태스크 시작/확인 TTS 책임 분담 [팀 확정 필요]
duplicate_window_sec: 2.0
# 정상 LLM은 요청 의미를 해석하고 core가 보류 문맥/대상/형식을 검증합니다. 전체 문형은 폴백용입니다.
# request_patterns는 현재 판별에 사용하지 않으며 호환용으로 유지합니다.
# 모호=clarify 정책은 사용자 확정. D 자료의 E/D 승인·후속 확인 대화는 [팀 확정 필요].
request_patterns: ['찾아', '찾아줘', '꺼내', '가져', '갖다', '줄래', '주세요', '주면', '필요']
unsupported_patterns: ['넣어', '옮겨', '정리', '전부', '모두', '아래 서랍', '닫아', '열어', '분류', '찾지', '꺼내지', '가져오지', '하지 마', '하지마']
cancel_phrases: ['멈춰', '정지', '취소', '그만', '중단해']
status_phrases: ['지금 뭐 해', '지금 뭐해', '상태 알려', '진행 상황']

# 원본 기반 기능 시운전 [팀 확정 필요]: 실제 발화 종료/AC 지연은 미측정
recording_mode: fixed
record_duration_sec: 5.0
timing_mode: commissioning
diagnostic_detail: false

# MeloTTS·음성 속도1.2 사용자 확정. 장치/스레드/상한은 시운전 제안 [팀 확정 필요]
tts_engine: melotts
tts_melotts_python: .venvs/melotts/bin/python
tts_melotts_assets: models/tts/melotts
tts_melotts_speaker: KR
tts_melotts_speed: 1.2
tts_melotts_threads: 4
tts_melotts_startup_timeout_sec: 60.0
tts_melotts_warmup_text: 준비되었습니다.
tts_melotts_prefill_texts:
- 그 요청은 지원하지 않습니다.
- 등록된 물품 하나를 요청해 주세요.

# 로컬 VAD 발화 판정: 소음/짧은 실제 발화로 튜닝 [팀 확정 필요]
speech_vad_threshold: 0.5
speech_min_voiced_sec: 0.15
speech_vad_model: null # 설치된 openwakeword Silero 자산; 자동 다운로드 없음

# P1 clarify 기본 안내. 의미 검증된 LLM 질문은 유지하고 원본은 상세 파일에 보존
clarify_prompts:
  empty: 다시 말씀해 주세요.
  multiple: 한 물품씩 요청해 주세요.
  bare: 그 물품을 가져다드릴까요?
  request: 요청을 확인해 다시 말씀해 주세요.
  missing_item: 물품 이름을 확인해 다시 요청해 주세요.
  unconfirmed: 물품 이름과 가져오기 요청을 확인해 다시 말씀해 주세요.
  general: 물품 이름과 원하는 동작을 다시 말씀해 주세요.
  audio_failure: 음성을 처리하지 못했습니다. 다시 말씀해 주세요.
  no_speech: 다시 말씀해 주세요.
  tts_failure: 음성 안내를 확인하지 못했습니다. 실행을 보류합니다.

# P2 E internal policy only; no Runner/wire adapter enabled.
pick_verify_lower_bound_m: 0.010 # 사용자 결정: 망치손잡이12.5mm - 여유2.5mm, 엄격 >. B 공용 min_width 대체 아님.
resume_admission_window_sec: 10.0 # 사용자 결정: 실제 TTS 완료→Whisper SDK 호출 직전, 10.0 포함.
resume_stt_result_timeout_sec: 15.0 # 승인 초기 운영값; SDK 호출→정상 STT 결과.
resume_independent_request_timeout_sec: 30.0 # 새 녹음→STT/분류/C 등록 확인 전체.
place_admission_window_sec: 10.0 # 실제 TTS 완료→SDK 접수.
place_stt_result_timeout_sec: 15.0 # SDK 호출→정상 STT 결과.
place_max_reasks: 1 # 최초 질문 외 모호 응답 재질문 상한.
p2_goal_enabled: false # 선정 목표의 명시 opt-in. 발신은 request_run_enabled와 현재 C 연결 확인도 필요.
p2_goal_catalog: # #150 선정 목표 원본. 관측 초기 상태·행동 순서는 포함하지 않음.
  - [{predicate: located_in, subject: eraser, value: handover_zone}]
  - [{predicate: open, subject: drawer_top, value: true}]
  - [{predicate: open, subject: drawer_top, value: false}]
  - [{predicate: located_in, subject: eraser, value: handover_zone}, {predicate: open, subject: drawer_top, value: true}]
  - [{predicate: located_in, subject: lip_balm, value: handover_zone}]

# P1 현재 질문·응답/진단 제안값 [팀 확정 필요]. P2 접수창과 독립입니다.
dialogue_timeout_sec: 30.0 # 질문 TTS 완료 후 현재 문맥 상한 제안; null이면 후속 결합 보류.
response_max_chars: 160
# 일반 콘솔은 핵심만, diagnostic_detail=true이면 아래 상세파일에 저장합니다.
diagnostic_file: logs/voice/diagnostic.jsonl
diagnostic_max_bytes: 10485760 # 회전 제안 10MiB; 단일 초대형 원본 기록은 분할하지 않음.
diagnostic_backups: 3
diagnostic_queue_size: 128
# 모델/내용 identity는 유지, 초기 필수 문장+자주 사용한 검증 문장만 bounded 선준비.
tts_prefill_progress_every: 8 # 선준비 진행 표시 간격 제안
tts_prefill_max_texts: 256
tts_prefill_max_chars: 160
tts_prefill_max_bytes: 65536 # UTF-8 선준비 문장 전체 용량 상한 제안
tts_frequent_max_texts: 32
tts_frequent_min_uses: 2
tts_frequent_max_bytes: 1048576 # 검증문장 선택 기록 용량; 기존 WAV/로컬자산 삭제하지 않음.

# STT 제한 원인별 고정 안내. 누락된 오래된 local 설정은 loader 기본값을 사용합니다.
stt_error_prompts:
  rate_limit: 음성 인식 요청이 너무 많아 처리하지 못했어요. 잠시 후 새 요청을 해 주세요.
  quota: 음성 인식 API의 크레딧이나 사용 한도를 확인해 주세요. 요청은 실행하지 않았어요.
  unknown_429: 음성 인식 API가 요청을 제한했지만 원인은 확인되지 않았어요. 오류 기록을 확인해 주세요.

# E-VOICE-FLOW 승인 시험 옵션. 숫자는 시험 제안이며 [팀 확정 필요]. 기본 녹음/모델/예산은 불변.
voice_flow:
  wake_cue_enabled: false
  cue_rate_hz: 16000
  cue_tones_hz: [660.0, 880.0]
  cue_tone_sec: 0.08
  cue_gap_sec: 0.02
  cue_gain: 0.18
  cue_guard_sec: 0.12
  cue_timeout_sec: 2.0
  capture_save_wav: false
  capture_dir: null
  capture_trim: false
  trim_padding_sec: 0.15
  stt_context_hint_enabled: true
  stt_hint_template: '현재 질문은 {item} 가져오기 확인입니다. 짧은 답: 응, 어어, 네, 맞아, 아니요, 가져다줘.'
  context_reply_pattern: '(?:(?:어어|어|응|네|예)[,，]?)?(?:(?:맞아|맞아요)[,，]?)?(?:(?:그거|그걸로|그걸)?[,，]?(?:가져다|갖다|가져|건네)(?:줘|주세요)|그걸로|맞아|맞아요)'
  status_prompts:
    running: '현재 작업을 진행 중이에요. 작업이 끝난 뒤 새 요청을 해 주세요.'
    locked: '작업이 중단되거나 잠겨 있어요. 상태를 확인해 주세요.'
    unconfirmed: '현재 작업 상태를 확인할 수 없어 새 요청을 보류합니다.'
  empty_reply_prompt: '답을 인식하지 못했어요. 같은 질문의 답을 다시 말씀해 주세요.'
  dummy_auto_complete: false

# 승인 핫픽스의 안내 문구. 단일 값 원본이며 실제 현재 상태/모션을 단정하지 않습니다.
voice_hotfix:
  control_recover: '더미 복구 확인이 끝났습니다. 새 웨이크 후 이어서 해라고 말씀해 주세요. 실제 로봇 복구 확인은 아닙니다.'
  control_resume: '더미 작업 재개를 수락했습니다. 안내가 끝나면 더미 실행 상태로 돌아갑니다. 실제 로봇은 움직이지 않습니다.'
  control_end: '더미 작업 종료를 수락했습니다. 안내가 끝나면 새 요청을 받을 수 있습니다. 물리 작업 완료는 아닙니다.'
  control_failed: '음성 인식 또는 재개 조건이 확인되지 않아 중단 작업을 유지합니다. 새 웨이크 후 다시 명시적으로 말씀해 주세요.'
  availability: '{item} 물품은 등록 지원 대상입니다. 실제 재고와 파지는 확인하지 못했어요. 가져오기 요청이 맞나요?'
  initial_location: '{item_topic} 초기 배치 기준 {place}에 있습니다. 실제 현재 위치는 확인하지 못했어요.'
  initial_open: '{place_topic} 초기 배치 기준 {value} 상태입니다. 실제 현재 상태는 확인하지 못했어요.'
  open_true: 열림
  open_false: 닫힘
  unknown_state: 초기 배치에서도 해당 상태를 확인하지 못했어요.
  no_work: 보존된 중단 작업이 없습니다. 상태를 확인해 주세요.
  no_end_work: 종료할 작업이 없습니다.
  control_held: 중단 작업의 기존 안전 확인 경로로 요청을 전달합니다. 실제 복구나 재개 완료는 아닙니다.

  recorded_location: '{item_topic} Runner 기록 기준 {place}에 있습니다. 실제 현재 위치는 별도 확인이 필요합니다.'
  recorded_open: '{place_topic} Runner 기록 기준 {value} 상태입니다. 실제 현재 상태는 별도 확인이 필요합니다.'
  unknown_recorded_state: Runner 기록에서 해당 상태를 확인하지 못했어요. 초기 배치를 현재 상태로 대신 안내하지 않습니다.
