  exit_x_mm: 300.0              # 놓으러 갈 때 서랍 안에서 먼저 이 x 까지 로봇 쪽으로 당김 (x 클수록 팔이 펴져 특이점, 서랍 안쪽 x 232~525)
  free_lift_z_mm: 150.0         # 서랍 밖(트레이 등)에서 관절 이동 전 이 높이보다 낮으면 먼저 수직으로 올림 (트레이 테두리 z 약 47, tray_view 100, 홈 약 195) [#83 D 재검토]
  blend_mm: 20.0                # 이어지는 이동(올리기 → 관절 이동, y 맞추기 → 기울여 목표물 위)을 끝 이 거리 안에서 이음 — 멈추지 않음 [사용자 10/07].
