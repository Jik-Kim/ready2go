  turn_deg_s: 60.0              # 45 → 60 [사용자 10/11]. 직선 이동 중 방향 회전 속도 (예전 30 → 20 → 15 → 22.5, 기울일 때 쿵쿵). 10/07 2배 [사용자 "끌기·놓기 말고 최대한 빠르게"]
  turn_acc_deg_s2: 60.0         # 회전 가속 (예전 60 → 22.5, 10/07 2배)
