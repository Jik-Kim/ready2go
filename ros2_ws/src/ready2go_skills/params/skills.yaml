  view_joint_deg_s: 150.0       # 120 → 150 [사용자 10/11]. 탑뷰·바텀뷰(drawer_top_view)·손잡이 앞(drawer_approach)·빈손 홈(10/12 사용자 "닫고 홈이 느림") 관절 이동만. 30 → 90 [사용자 10/08 "너무 느림"] → 120 [사용자 10/10 "더 올려도 됨"]. 서버 VEL 과 따로. 첫 실행은 케이블 확인
