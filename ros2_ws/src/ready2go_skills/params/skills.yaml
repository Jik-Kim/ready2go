  line_acc_ratio: 1.0           # 직선 가속 = 속도 × 이 값 (예전 2.0 → 시작·멈춤이 쿵쿵, 10/06 사용자)
  in_drawer_mm_s: 150.0         # 100 → 150 [사용자 10/11 "이동 답답"]. [사용자 10/08 "조금만 더" 75 → 100] 서랍 안·위 직선 (경유점 → 물체 위, 집으러 내려가기 1 cm 전까지, 서랍 안 올리기·들고 경유점 1로) [사용자 10/07 밤 "서랍 안은 속도 낮춰"]. 10/06 첫 값 75
  in_drawer_joint_deg_s: 120.0  # 90 → 120 [사용자 10/11]. [사용자 10/08 30 → 45, 10/10 → 90 "탑뷰 갈 땐 빠릿한데 넛지하러 갈 때 돌리는 게 느림"] 탑뷰 → 서랍 안 경유점(drag_down) 관절 이동 — 탑뷰(view_joint)와 같게, 서버 관절 속도와 따로
