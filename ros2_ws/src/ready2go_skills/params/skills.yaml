# ready2go_skills 파라미터 (담당 B). 확정 전 값은 [팀 확정 필요] — 코드에 두지 않는다.
# 기대 TCP·툴 이름은 config/calibration/calibration_meta.yaml, 서랍 기준 인출 거리는 config/places.yaml tf_at_travel_m 에서 읽는다(복사하지 않음).
motion_guard:   # core/motion_guard.py (#15)
  travel_tolerance_m: 0.005     # [팀 확정 필요] drawer_displacement 와 tf_at_travel_m 차이 허용. 넘으면 DRAWER_NOT_AT_TRAVEL. 실측(스토퍼 재현성) 후 확정
  on_floor_tolerance_m: 0.01    # [팀 확정 필요] top_z − 물체 높이 허용. 넘으면 NOT_ON_FLOOR. 검정·반사 물체 뎁스 오차(#15 A 코멘트) 실측 후 확정
drawer_control:   # core/drawer_plan.py (#13, docs/domain.md 8.4). 모두 [팀 확정 필요] — 10/06 실물 측정 후 확정
  pos_tol_m: 0.002              # 목표·닫힘 위치 도달 판정 여유
  stuck_force_n: 30.0           # [추정] 인출 중 저항이 이보다 크면 DRAWER_STUCK (즉시 정지). 정상 인출 저항을 재서 여유 두고 정함
  stuck_force_by_drawer_n:       # 서랍별 덮어쓰기. 아래 칸은 위 칸보다 꽉 맞물려 출발할 때 저항이 큼 — 인출 7.3 mm 에서 34.9 N 으로 멈춤 [실측 PC2 10/11, 사용자 "아래 칸 결착력이 좋음"]
    drawer_bottom: 45.0
  push_stop_force_n: 15.0       # 닫기: 닫힘 위치까지 위치로 밀되, 미는 축 힘이 이보다 크면 멈춤 (닫힘 여유 안이면 닫힘, 밖이면 CLOSE_NOT_CONFIRMED). 25 → 15: 끝에서 세게 밂 [사용자 10/06 저녁]
  close_overtravel_m: 0.002     # 닫기: 닫힌 손잡이 위치(열 때 잡는 y)보다 이만큼 더 밂 [사용자 10/06: 2 mm면 잘 닫힘]
pick:   # core/pick_plan.py (#15)
  tcp_above_top_m: 0.0          # [실측 B 10/04, #8] TCP를 물체 윗면 높이에 둠 — 지우개(11.5 mm) TCP 바닥 위 10.0~11.4 mm에서 3/3 파지. 높은 물체는 10/06 확인
  tcp_above_top_by_class_m: {}  # 물건별 tcp_above_top_m 덮어쓰기 (m, 음수 = 윗면보다 아래). 크게 벌리면 손끝이 TCP 보다 위로 감(약 17 mm, 85~100 mm 벌림 [실측 10/06])
                                #   → 가림막(높이 40.5, 벌림 87 mm)처럼 넓고 키 큰 물건은 윗면 높이로는 손끝이 판 위로 지나갈 수 있음 [P2 시뮬레이션 10/10 — 실측으로 채움, 예: {cover_plate: -0.015}]
  min_tcp_above_floor_m: 0.010  # [실측 B 10/04, #8] 성공한 가장 낮은 TCP 높이. 닫힌 손끝이 TCP보다 약 10 mm 아래라 이보다 낮추지 않음
  open_margin_m: 0.013          # [실측 B 10/04, #8] 벌림 = 짧은 변 + 13 mm (지우개 22 mm → 35 mm). 완전히 벌리면 손끝이 바닥에 닿음
  max_open_width_m: 0.100       # [문서] RG2 최대 110 mm에서 여유를 뺀 값 (#8 판정 기준)
  allow_stacked: true           # 다른 물체 위에 얹힌 물체도 집음 [사용자 10/09, P2 3개 겹침 망치·캐러멜·지우개 약 55 mm]. 받침 = 비전 top_z − 물체 높이. false 면 NOT_ON_FLOOR (P1)
  stack_top_clear_m: 0.010      # [팀 확정 필요] 쌓인 윗면 상한 = 서랍 테두리(interior_m[2]) − 이 값. 서랍 안 옆 이동(테두리 + 5 mm, 닫힌 손끝 약 10 mm 아래)과 안 부딪히게
  slow_last_mm: 10.0            # 잡는 높이 이 거리 전까지는 speed.line_mm_s, 마지막만 speed.grasp_mm_s [사용자 10/07]
  front_tilt_deg: 20.0          # 긴 변 잡기가 손잡이 쪽 벽 가까이면 그 벽 쪽으로 기울여 잡음(손끝 벽 쪽, 몸통 안쪽) — 앞판이 테두리보다 높아 수직 몸통이 닿음 [사용자 10/10 PC2]. 각도는 넛지 drag.tilt_deg 와 같게 [실물 확인 필요]. 0 이면 안 기울임
  axis_grasp: true              # 벌림 100 mm 안 물체(지우개·캐러멜·차키): 가로(긴 변이 서랍 y 에 가까움)면 긴 변 양끝, 세로면 짧은 변 — 손가락은 물체 각도대로.
                                #   넛지는 서랍 x·y 로만 [사용자 10/10 PC2]. 원통형(round_classes)은 따로. 긴 물체는 짧은 변
  front_tilt_within_mm: 48.0    # 가로 파지가 손잡이 쪽 벽에서 이 거리 안이면 손잡이 쪽으로 기울임(앞판에 몸통) — 예전 판단 거리 47.9 (짧은 변 앞벽 자리 39.9 + 8) [제안, 실물 확인 필요]
  long_side_yaw_slack_deg: 7.0  # 긴 변 양끝 잡기 폭 판정: 비전 각도가 이만큼 틀려 비스듬히 물린 폭(긴 변 cos + 짧은 변 sin)까지 허용 [실측 PC2 10/11 캐러멜 79.7/75 ≈ 6°, 온톨로지 75 는 버니어 실측 #8]
  front_tilt_lower_mm: 0.0      # 손잡이 쪽으로 기울여 긴 변 잡을 때 수직 잡기 높이보다 더 내림 [사용자 10/11 "더 깊이"]. 바닥 찍기(예전 touch_floor, 10/12 코드 정리로 뺌)를 쓰던 때는 0, 높이 계산이면 5 정도
  at_waypoint_tol_deg: 0.5      # 집기 시작 때 실측 관절이 경유점(drag_down)에서 모든 축 이 값 안이면 경유점 이동 건너뜀 (이미 거기 — 중복 이동 없음) [E #245 제안 10/12]
  grip_height_ratio: 0.5        # 서랍 안 집기 높이 [사용자 10/11 "넛지(바닥 찍기) 빼고 온톨로지 높이 반영"]: 닫은 손끝(잡는 폭에서 — gripper.tip_below_tcp_mm 표)이
                                #   받침(바닥) 위 온톨로지 높이(size_m[2]) × 이 비율. 지우개 손끝 약 5~6 mm 3/3 [실측 10/04]·립밤 교시 손끝 약 11 mm [실측 10/10] ≈ 높이 절반.
                                #   크게 벌리면 손끝이 TCP 보다 위(88 mm 에서 +16 [실측 10/11 캐러멜]) → TCP 는 그만큼 낮게. null = 예전(윗면 높이)
  min_tip_above_floor_mm: 2.0   # 닫은 손끝 바닥 위 최소
  tip_above_floor_by_class_mm:  # 물건별 닫은 손끝 높이 (바닥 위 mm) — 구조가 다른 것. 덮개 판: 다리 볼트 위 판(아랫면 21, 두께 8) 가운데 [실측 A 10/03, #8]. 온톨로지에 넣으면 그걸로
    cover_plate: 20.0            #   25 → 20 [사용자 10/12 PC2 "z 로 너무 덜 들어가 판이 안 잡힘, 5 mm 더"] — 판 아랫면 21·두께 8(#8)보다 낮지만 실물 기준. 손끝 높이 표(벌림 87 mm 근처 대략값, 10/11 트러블슈팅 33) 오차 [추정]
    toy_car: 21.8               #   위쪽 얇은 부분(잡은 폭 30.9·48.0)을 잡게 — 높이 절반 16.25 + 5.5 [사용자 10/11 PC2 "그 부분이 5.5 정도 높아"]. 아래 몸통은 두꺼워(버니어 35.1·54.8) 구조가 복잡
    car_key: 4.0                #   높이 절반(7.9)이면 너무 얕게 잡힘 [사용자 10/11 PC2 "더 깊게"] → 밑면(받침) 위 4 mm
  under_clear_by_class_mm:      # 이 물건 밑 여유 높이 — 집을 때 이 물건 footprint 와 겹치고 온톨로지 높이가 이 이하인 이웃은 밑에 깔린 것으로 보고 온톨로지 높이로 이웃 검사 (비전 top_z 번짐·가림 관계 null 이어도). 덮개 판 아랫면 21 mm [실측 A 10/03, #8] [사용자 10/12 "커버플레이트는 겹쳐도 집을 수 있게"]
    cover_plate: 21.0
  under_smear_mm: 5.0           # 위 예외는 관측 top_z ≤ 판 밑 여유 + 이 값일 때만 — 그보다 높으면 판 밑일 수 없음(쌓임·세움) → 관측 값으로 막음 [#235 리뷰 P1]. 판 밑 지우개 번짐 실측 23.4·23.5·25.5 mm [PC2 10/12, 제안]
  under_gap_by_class_mm:        # 다리 안쪽 간격 [판 긴 변 방향, 짧은 변 방향] mm — 분할 모델이 판 밑이라고 한 물체(occluded_by 에 판)가 다리 사이로 지나갈 폭이면
    cover_plate: [65.0, 35.0]   #   판 집기 손가락 확인에서 뺌 (몽키·망치처럼 길어 삐져나와도) [문서 hardware.md #8 "다리 안쪽 65×35", 사용자 10/13]
  tilt_align_deg: 15.0          # 기울여 잡기는 긴 변이 그 벽과 이 각도 안으로 나란할 때만, 손가락은 서랍 축에 맞춤(교시한 앞뒤·좌우 네 방향만) —
                                #   비스듬한 물체를 대각선으로 눕혀 잡다 못 잡음 [사용자 10/10 PC2 "대각선 절대 안 됨"]. 15° 는 [제안, 사용자 확인 필요]
  round_classes: [lip_balm]     # 굴러가는 원통형 [사용자 10/10 PC2 "딱풀·립밤은 예외"] — 항상 긴 변 양끝으로 잡음(가운데도) [사용자 10/10 "원통형만 긴 변"], 가생이면 넛지 없이 긴 변 + 벽 쪽 기울임, 구석이면 긴 변 방향으로만 넛지(짧은 변 방향은 굴러감). 딱풀은 비전 학습에 없음(toy_wrench 로 잡힘, docs/vision.md V3b)
  round_wall:                   # 원통형이 옆벽에 붙으면 긴 변 양끝 + 그 벽 쪽으로 기울여 집기 [실측 사용자 10/10 PC2 립밤 왼벽, 집은 채 벽에 닿게 직접교시
                                #   posx [241.695, -211.228, 199.150, 179.914, 159.967, 89.936] posj [-31.286, 7.208, 84.944, -10.589, 104.952, -122.317]
                                #   → 서랍 좌표 TCP 왼벽 경계에서 5.4 mm, 바닥 위 1.2 mm, 닫힘 축 = 서랍 x(긴 변), 잡은 폭 72.5 mm (립밤 71.8)]
    tilt_deg: 20.0              #   교시 B 160.0 → 20°, 손끝이 벽 쪽 (넛지 drag.tilt_deg 와 같음)
    tcp_to_wall_mm: 4.6         #   TCP 를 물체 가운데보다 벽 쪽으로 — 교시 5.4 mm, 벽에 붙은 립밤 가운데 10 mm(반지름) [계산]
    tcp_below_center_mm: 8.8    #   TCP 를 물체 가운데 높이보다 아래로 — 교시 바닥 위 1.2 mm, 가운데 10 mm [계산]
  lift_away_mm: 2.0             # 집고 올릴 때 서랍 x·y 각각 가운데 쪽으로 이만큼(미미한 대각선) — 벽에 붙은 물체가 벽에 끌려 기울지 않게 [사용자 10/10 "x·y 2 mm 정도"]
  # 잡는 폭(실제로 잡은 폭, 외접 박스와 다른 물품만)은 온톨로지 config/item_grasp.yaml grasp_width_m·grasp_width_long_m 으로 옮김 [10/11 — B 실측, 팀 공유]
  open_by_grasp_width: [toy_wrench, toy_hammer]   # 이 물건은 벌림도 item_grasp.yaml grasp_width_m + open_margin_m (손잡이 기준) — 아니면 외접 짧은 변(머리 61·75 mm) + 13 [사용자 10/11 PC2]. 비전 위치(박스 가운데)가 손잡이가 아니면 못 잡을 수 있음(망치)
# ---- 아래는 실물 동작 (10/05~06 로봇 실측, practice/B/2026-10-06_practice.md). 단위: 거리 mm(표기 _m은 m), 속도 mm/s, 힘 N ----
gripper:
  rg2_ip: 192.168.1.1           # [실측] 환경변수 RG2_HOST 가 있으면 그 값
  min_width_m: 0.002            # 이 폭 이하면 빈손 (빈손 닫힘 0.9 mm, grip_detected True [실측 B 10/03, 10/05])
  pick_min_width_m: 0.010       # 집기 성공 하한: 닫은 폭이 이 값 초과 [사용자 결정 10/08, #43 — 망치 손잡이 12.5 − 2.5]. 옮기는 중 놓침은 min_width_m(2 mm) 그대로
  slip_tolerance_m: 0.002       # 잡은 뒤 폭 변화 허용 (지우개 고무 눌림 0.6 mm [실측 B 10/04])
  grasp_width_tolerance_m: 0.003   # 잡은 폭 vs 기대 폭 = item_grasp.yaml grasp_width_m(긴 변 잡기면 grasp_width_long_m), 없으면 짧은 변(긴 변) (지우개 22 → 21.0~21.4 mm [실측 B 10/04·10/06])
  grip_force_by_class_n: {caramel_box: 10.0}   # 물건별 잡는 힘 (item_grasp.yaml grip_force 가 null 일 때, 기본보다 먼저) — 캐러멜은 20 N 이면 상자가 찌그러짐 [사용자 10/11 PC2 "으깨지겠다, 10 N"]. 팀 확정되면 온톨로지 grip_force 로
  default_grip_force_n: 20.0    # item_grasp.yaml grip_force 가 null 일 때 (지금 전부 null — 팀 확정 전). 7 → 20 [사용자 10/11 PC2 "전부 20 으로" — 차키 7 N 에서 옮기다 미끄러져 떨어짐]. 지우개 20 N 3/3 [실측 10/04] (10/06 "20 N 너무 셈" 으로 7 이었음)
  open_margin_mm: 13.0          # 벌림 = 짧은 변 + 이 값 [실측 B 10/04]
  tip_below_tcp_mm:             # 손끝이 TCP보다 아래인 거리 — 벌릴수록 손끝이 올라감 [실측 B 10/03·10/06, 트러블슈팅 1]
    open_mm: [0.9, 35.0, 92.5]  #   크게 벌리면 손끝이 TCP보다 약 17 mm 위 [실측 10/06, 폭 85·100 중 확인 필요] → 92.5 에 −17 로 넣음 [10/11, 바닥 닿고 올리는 거리 계산용]. 표 밖은 끝값
    below_mm: [10.0, 2.5, -17.0]
  wall_clearance_mm:            # TCP가 벽에 갈 수 있는 최소 거리 [실측 B 10/05 서랍 옆벽, 10/06 손잡이 쪽 벽 35 mm에서 5.7~6.9 → 9 유지]
    across: {open_mm: [0.9, 35.0, 78.5, 100.0], dist_mm: [21.6, 39.9, 62.6, 74.0]}   # 닫힘 축이 벽과 직각 (손가락 바깥 관절이 먼저 닿음). 78.5·100 = 아래 칸 y 0 옆벽 바닥 근처 관절 닿음 TCP [실측 PC2 10/12, 사용자 posx 296.1/−130.1 · 307.4/−130.0] — 예전 60 → 46.6·100 → 59.6(10/05)은 관절이 테두리 위였던 값으로 보임(10~14 mm 작음, B free 가 4.3 mm 남는다던 자리에서 닿음). 관절 ≈ 벌림/2 + 23 mm (35 점·앞판 표와도 맞음)
    along_mm: 9.0               # 닫힘 축이 벽과 나란히 (닫힘 9.0, 최대 벌림 8.7)
    front_across: {open_mm: [66.0, 100.3], dist_mm: [59.3, 75.1]}   # 손잡이 쪽 벽(앞판, 테두리보다 높음) — 수직 그리퍼, 닫힘 축 서랍 x, 바닥 근처에서 앞판에 닿기 직전 TCP 의 서랍 x [실측 PC2 10/11 위 칸, 지그]. 옆벽 표(across)보다 10.7·15.5 mm 더 — 그 차를 across 에 더해 씀(표 밖은 끝값). 10/11 긴 변 우회(지우개 세로, 옆 몽키)가 TCP 57.4 mm 에서 앞판에 닿음
  wall_margin_mm: 3.0           # 위 거리에 더하는 여유 (놓기 등) [팀 확정 필요]
  pick_wall_margin_mm: 8.0      # 바로 집을 수 있는지(아니면 넛지) 판단에만 쓰는 여유 — 3 → 8: 애매한 자리는 넛지로 확실히, 뒷벽 쪽 애매한 자리에서 그리퍼가 벽에 닿음 [사용자 10/10 PC2]
  tip_radius_mm: 15.8           # 손끝 끝(옆에서 본 반원 U) 반지름 ≈ 닫힘 축에 수직인 손가락 반폭 [계산 10/06: 옆벽 along 9.0 + 바닥에서 실제 벽이
                                #   서랍 좌표 경계보다 6.8 mm 바깥(벽에 붙인 지우개 중심 터치) — 사진상 끝이 반원 (사용자 10/06)] [실물 확인 필요]
  fingertip_outer_mm: 13.0      # TCP → 닫힌 손끝 바깥면 (지우개 양옆 터치 47.06 − 21.0 = 26.06 → 반) [실측 B 10/06]
