  press_attempts: 3             # 끌기 전(누르기·힘 맞추기) 실패하면 누를 자리 위로 올라가 같은 자리에서 다시, 총 이 횟수 [사용자 10/07 "넛지 안 되면 닫지 말고 다시"]. 끌기 시작 뒤 실패·안전 코드는 다시 안 함
  contact_z_tol_mm: 3.0         # 접촉 TCP z 가 예상 ± 이 값 밖이면 끌지 않음
  press_x_lim_mm: 16.0          # 옆벽에서 y 로 끌 때 누르는 TCP 를 손잡이 쪽·안쪽 벽에서 이만큼 뗌. 손끝 실측 12(along 9 + 3)로는 손잡이 쪽 벽에 가로로 붙은 지우개를 누를 때 그리퍼 몸통이 손잡이 쪽 벽에 약 3 mm 닿음 [사용자 10/11 PC2] → 16
  speed_mm_s: 10.0              # 끄는 속도
  search_below_mm: 4.0          # 예상 접촉 높이보다 이만큼 더 내려가도 접촉이 없으면 실패
  start_above_mm: 3.0           # 예상 접촉 높이 위에서 시작. 5 → 3 [사용자 10/07 "너무 높은 곳에서 천천히 내려옴"] (접촉 높이 판정 ± 3 mm 와 같음)
  extra_mm: 5.0                 # 계산한 최소 거리에 더하는 여유 — 비전 y 오차 ±2 mm + 3 [10/10: 3 → 5] (세로 지우개 오른쪽 위 구석 → 약 39 mm)
  max_shift_mm: 80.0
  press_inset_mm: 3.0           # 누르는 점은 물체 가장자리에서 이만큼 안쪽까지
  lift_mm: 30.0                 # 끈 뒤 올라가는 거리
neighbor:   # core/neighbor_check.py — 집기·끌기 전 옆 물체 확인 (입력 scan 이 있을 때) [사용자 10/09 서랍 안 랜덤 배치]
  margin_mm: 5.0                # [팀 확정 필요] footprint 여유 — 비전 위치 오차 2.5 mm [실측 PC2 10/08, #155] + 여유 (place.footprint_margin_mm 과 같은 값)
  below_tol_m: 0.003            # [팀 확정 필요] 목표 받침 + 이 값 이하 윗면(top_z)의 이웃은 손가락보다 아래 → 무시 (쌓인 물체의 받침)
