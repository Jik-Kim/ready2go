    drawer_bottom: [381.629, -300.013, 123.457, 89.987, -89.981, 179.903]   # y = 위 칸 −2 mm [사용자 10/10 PC2: 실측 −290.218 로는 못 잡음 → 위 칸과 맞춤 → 2 mm 더]. [실측 B 10/08 직접교시] 아래 칸 손잡이 파지(닫힘), posj [6.903, 37.293, 120.722, 96.500, -92.763, -21.895]. 위 칸과 손목 방향 0.1° 안, z −148.2, y −2.5. 끝까지 연 손잡이 [381.970, -67.644, 120.373] → 인출 226.6 mm
  handle_grasp_back_mm: 1.0     # 손잡이 잡을 때 실측 자리보다 당기는 쪽(+y)으로 이만큼 덜 들어감 — 너무 붙음 [사용자 10/06 2] → 잡으러 가며 서랍이 조금 밀림 [사용자 10/08 +2] → 얕게 잡혀 불안, 3 mm 더 들어가기 [사용자 10/10 아침 PC2]
