  close_pos_tol_m: 0.015        # 닫힘 위치 판정 여유 (미는 손가락 앞면 오프셋 [추정] 오차 포함) [팀 확정 필요]
place:
  free_repickable_only: false   # true = slot "free" 는 다시 집을 수 있는 자리만(없으면 NO_FREE_SPACE, #337). false = 다시 집을 수 있는 자리를 먼저(여유 포함), 없으면 놓기만 되는 자리 — 원복 때 WALL_TOO_CLOSE 면 넛지 → 다시 보기 → 집기 [사용자 10/14 PC2 "걍 일단 상관없이 놓고 넛지로 끌고 오자": 아래 칸 판·위 칸 꽉 찬 배치는 다시 집히는 빈 자리가 없어 집지도 않고 닫음]
  free_repick_margin_mm: 5.0    # 다시 집기 검사를 놓을 자리 ±이만큼 옮겨서도 — 비전 위치 오차 2.5 mm [실측 #155] + 여유 (neighbor.margin_mm 과 같은 값)
  free_repick_margin_deg: 5.0   # 다시 집기 검사를 ±이 각도 돌려서도 — 비전 각도 오차 [추정]
  free_try: 0                   # slot "free" 빈 자리 후보 중 놓기·다시 집기 검사할 개수. 0 = 전부 [사용자 10/14: 앞 60개(벽에 붙은 자리부터)만 보면 S1 위 칸 후보 약 150개 중 뒤쪽 다시 집히는 자리를 못 봄 → NO_FREE_SPACE]. make_room(B clear)은 core 기본 60
  drop_m: 0.0015                # 집을 때 TCP 높이 + 이 값에서 놓음 → 물체가 1.5 mm 떠서 놓임 [팀 확정 필요]
  fast_guard_n: 8.0             # 서랍 안 놓기 빠르게 내려가는 구간(slow_last_mm 위)도 z 힘이 이만큼 변하면 멈추고 그 자리에 놓음 — 비전이 못 본 받침에 쥔 물체가 닿을 때 [사용자 10/12 PC2 putback 이 몽키를 누름]. 넛지 누르기 상한과 같은 값
  tilt_back_tol_mm: 3.0        # 기울여 집은 물체를 원래 자리(집을 때 pose 와 이 거리·각도 안)로 놓으면 집을 때 기울인 자세 그대로 거꾸로 놓음 — 수직으론 손가락이 벽 밖 [사용자 10/12 PC2 손잡이 벽 립밤 putback]. 비전 오차 정도 [제안]
  tilt_back_tol_deg: 5.0
  free_wall_extra_mm: 0.0       # B free 후보만: 벽 여유(gripper.wall_margin_mm)에 더함. 10/12 임시 10 → 옆벽 관절 실측으로 gripper.wall_clearance_mm.across 고친 뒤 0
  touch_n: 3.0                  # 마지막 천천히 내릴 때 z 힘이 이만큼 변하면 바닥 닿음 → 멈추고 벌림 [사용자 10/10 "바닥에 얌전히"] [팀 확정 필요, 외력 잡음 #152]. 0 = 끔
  touch_overtravel_mm: 3.0      # 안 닿으면 계산 높이(drop_m 포함)보다 이만큼 더 내려가 멈춤 (트레이 없을 때 임시 8 → 새 트레이 놓고 3)
  touch_settle_s: 0.4           # 닿음 감지 전 힘 0점 잡기 멈춤 (force.tare_settle_s 0.7 대신) — 1 cm 위에서 한 번만 멈춤 [사용자 10/10 "멈췄다 가는 게 많음"]
  release_extra_mm: 6.0         # 놓을 때 잡은 폭보다 이만큼 더 벌림 (옆 칸 물건과 간섭 줄임, 칸 폭 45 mm)
  approach_m: 0.06              # 놓기 전 위 높이
  slow_last_mm: 10.0            # 놓는 높이 이 거리 전까지는 speed.line_mm_s, 마지막만 grasp_mm_s [사용자 10/07]
  slot_fit_max_mm: 60.0         # 고정 빈 자리(aside)에 큰 물체(가림막·긴 변으로 쥔 캐러멜)가 벽·이웃에 걸리면 자리 가운데에서 이 거리 안으로 (40 → 60: 아래 칸 aside 가 좁음 [P2 무작위 배치]) 가장 적게 옮겨(·90° 돌려) 놓음 [P2 시뮬레이션 10/10, 제안]. 0 = 안 옮김
  slot_fit_step_mm: 2.0         # 위 자리 맞춤 탐색 간격. 막힌 aside 에서 10~20 s 걸리던 건 이 간격이 아니라 후보마다 온톨로지 파일을 다시 읽던 것 → 캐시로 고침 [PC2 10/12 B unpack "계산이 엄청 오래"]
  restore_fit_max_mm: 20.0      # 되돌리기(명령한 pose, 바닥)인데 원래 자리를 이웃이 살짝 막으면 방향은 그대로 이 거리 안으로 가장 적게 옮겨 놓음 — 복구 기준 3 cm(AC-ACT-03)에서 비전 오차 ~10 mm 를 남긴 값 [PC2 10/12 Unpacking: 굴러 나온 립밤이 가림막 원래 자리를 막아 aside 에서 집어 aside 에 다시 놓음, 제안]. 0 = 안 옮김
  repick_noise_mm: 3.0          # [제안] 고정 자리(aside)는 비전 오차(위치 ±이 값·각도 ±repick_noise_deg)로 다시 봐도 넛지 없이 다시 집을 수 있는 곳만 [P2 시뮬레이션 10/11: 아래 칸 가림막 오차 ±3 mm·±5° 로 25번 중 8번 NO_PUSH_ACCESS]. 0 = 끔
  repick_noise_deg: 5.0
  allow_stack_place: true      # [사용자 10/12 "위에 놓기 해", FR-ACT-04 복구 지지면 = 바닥 또는 아래 물체 윗면] 명령한 pose(되돌리기)가 다른 물체 위면 그 윗면에 놓음 (쌓였던 차키를 캐러멜 위로) [P2 시뮬레이션 10/11]. false = 이웃이면 PLACE_BLOCKED (지금 계약)
  footprint_margin_mm: 5.0      # [팀 확정 필요] 서랍 안 놓기 footprint 여유 (쥔 물체 size_m + 벌린 손가락(gripper.fingertip_outer_mm) 둘레). 비전 위치 오차 2.5 mm [실측 PC2 10/08, #155] + 놓기 오차 미측정 (#166)
  default_obstacle_size_m: [0.10, 0.10]   # [팀 확정 필요] 서랍 안 놓기: 온톨로지에 치수 없는 이웃 class 의 footprint [긴 변, 짧은 변] m (#166)
drag:                           # nudge_object 실물: 기울여 손끝으로 눌러 옆으로 끌기 (트러블슈팅 2, #37)
  # [실측 B 10/06] 지우개 모서리 2 N에서 잘 끌림. 위치로 누르면 1 mm에 2 → 10 N → 힘 감지로 멈춤.
  #   힘 영점이 시간에 따라 흐름 → 내려가기 직전 0점. 서랍 닫히는 방향 끌기는 서랍이 같이 밀림 → 서랍 옆(y)으로만.
  touch_force_n: 5.0            # 닿음: 내려가다 이 힘을 넘으면 바로 멈추고, 멈춘 채 press_confirm 번 모두 넘으면 닿음 [사용자 10/07]
  press_max_force_n: 8.0        # 누르는 중 힘 z 상한 (멈춘 기준 대비). 출발 무시 구간에서도 늘 봄 → 넘으면 바로 멈추고 확인. 서랍 넘어감 14 N [사용자 10/07]
  touch_retries: 2              # 멈춘 뒤 확인에서 안 넘으면(튄 값) 그 자리에서 다시 내려감 — 이 횟수까지
  confirm_gap_s: 0.1            # 멈춘 뒤 확인 읽기 간격
  drag_force_n: [0.5, 1.2]      # 끄는 힘. [1.5, 2.5] [사용자 10/07] → 닿기만 해도 거의 다 끌림 [사용자 10/10 "2 N 보다 적게"]. 닿음 확인 뒤 relax_step_mm 씩 올려 상한 이하로, 하한 밑으로 지나치면 반 칸 내려감
  force_mode: false             # true = 닿은 뒤 두산 힘 제어(task_compliance_ctrl + set_desired_force, z 만)로 누를 자리 위에서 내려가 닿고 끄는 힘(drag_force_n 가운데)을 유지하며 끔 — 위치로 0.1 mm 씩 맞춘 높이 고정 대신. 내려가기부터 힘 제어(위치로 5 N 문턱·3번 확인·0.1 mm 맞추기 없음) — 휘는 상자·높이가 고르지 않은 물체(몽키 머리)·서랍 기울기 대응 [사용자 10/13 "시뮬 돌려 기존보다 좋으면"] [실물 미확인 — 켜기 전 PC2 저속 검증: 빈 바닥 → 지우개 → 빈 캐러멜 → 몽키]
  force_stiffness: [3000.0, 3000.0, 200.0, 200.0, 200.0, 200.0]   # 힘 제어 중 컴플라이언스 강성 (x y z N/m, 회전 Nm/rad) — z 만 부드럽게 [추정, 두산 기본 3000·200]
  force_ramp_s: 0.2             # 목표 힘·해제까지 바뀌는 시간 (0~1 s)
  force_touch_ratio: 0.7        # 힘 제어 누르기: 아래로 누르는 힘이 목표의 이 비율 이상이고
  force_still_mm: 0.05          #   z 가 0.05 s 사이 이만큼 안으로
  force_still_s: 0.2            #   이 시간 동안 그대로면 닿음
  force_search_below_mm: 12.0   # 예상 윗면 아래 이만큼 내려가도 안 닿으면 물체 아님(구멍·빈 자리) → 풀고 NO_OBJECT_CONTACT — 위치 방식 search_below_mm 4 보다 깊게(휘는 상자·몽키 머리) [추정]
  force_search_s: 4.0           # 이 시간 안에 닿지 않으면 NO_OBJECT_CONTACT [추정 — 힘 제어로 내려가는 속도 실물 확인 필요]
  force_reach_tol_mm: 5.0       # 힘 제어로 끌 때 도착 판정 허용 — z 를 제어기가 맞춰 명령 z 와 다름 [추정]
  push_inward_ok: false         # 손잡이 쪽 벽 물체를 안쪽으로 끌기 — 지우개는 됐지만 서랍이 같이 끌림 → 포기, 긴 변으로 잡기(안 되면 옆으로 끌고 긴 변) [사용자 10/10 PC2]
  square_to_handle_wall: true   # 손잡이 쪽 벽 근처에 비스듬히(가로·세로에서 tilt_align_deg 넘게) 놓여 못 잡으면 손잡이 쪽으로 벽까지 끌어 벽에 맞춰 눕힘
                                #   — 서랍 여는 방향이라 끝까지 열린 서랍은 안 끌림 → 다시 보고 가로면 기울여 긴 변, 세로면 짧은 변 [사용자 10/10 제안, 실물 미확인]
  push_from_behind: true        # 벽까지 밀기(손잡이 쪽 비스듬·립밤 벽으로)는 위에서 눌러 끌지 않고 물체 뒤에서 닫은 손가락 옆면으로 밂 [사용자 10/11 PC2 — 눌러 끌면 미끄러져 벽에 잘 안 붙음]. 뒤에 손 넣을 자리 없으면 예전 방식
  push_tip_above_floor_mm: 3.0  # 뒤에서 밀 때 닫은 손끝 높이 (바닥 위) — 물체 아래쪽을 밀어 넘어가지 않게 [사용자 10/11]
  push_start_gap_mm: 10.0       # 물체 뒤 끝에서 손가락 옆면까지 띄우고 내려감
  push_over_mm: -3.0            # 계산한 끝(물체가 벽에 붙어 누운 자리)보다 더 미는 거리. 2 → 0 [사용자 10/11 PC2 "너무 세게, 계산한 만큼만"] → −3 (0 에서도 "좀 셈", 밀착 뒤 지우개 가운데 x 12.9 = 벽이 경계보다 약 2 mm 안쪽 [실측]). 음수면 그만큼 덜 밂
  push_speed_mm_s: 40.0         # 뒤에서 밀기·물러나기 속도 [사용자 10/11 "단순 미는 건데 너무 느림" — 끌기 10 mm/s 와 따로, 제안]
  square_min_push_mm: 2.0       # 손잡이 쪽 벽 맞추기·뒤에서 밀기에서 이미 벽에 닿아 있어도 최소로 미는 거리 — 돌려 눕힘 (코드 기본값과 같음, 10/13 yaml 에 꺼내 둠)
  push_back_mm: 5.0             # 다 민 뒤 미는 반대쪽으로 물러났다가 올림 — 벽과 손가락 사이에 낀 물체가 마찰로 딸려 올라옴 [사용자 10/11 PC2]
  hole_classes: [masking_tape]  # 가운데가 뚫린 물체 — 위에서 누르면 손끝이 구멍으로 빠져 바닥에 닿음 → 넛지 대신 닫은 손가락을 구멍에 넣어 같은 방향·거리로 밂 (손끝 바닥 위 push_tip_above_floor_mm) [사용자 10/13 "넛지 말고 안에 넣어서 밀기, 예외로"] [실물 미확인 — 닫은 손가락이 구멍에 들어가는지 확인 필요]
  hole_slack_mm: 5.0            # 구멍 안에서 손가락이 안쪽 벽에 닿기 전 빈 거리 — 계획한 이동에 더 감 [추정 — 구멍 지름 실측 필요]
  hole_back_mm: 2.0             # 다 민 뒤 반대쪽으로 물러났다가 올림 — 구멍 벽에서 손가락을 떼서 테이프가 딸려 올라오지 않게 [추정]
  relax_step_mm: 0.1            # [사용자 10/07]
  relax_settle_s: 0.2           # 올린 뒤 멈춘 채 기다렸다가 힘 평균 (force.tare_samples 번). 0.3 → 0.2 [사용자 10/11 "넛지 너무 느림"]
  tare_settle_s: 0.4            # 넛지 누르기·끌기 직전 힘 0점 멈춤 (force.tare_settle_s 0.7 대신) [사용자 10/11 "넛지 너무 느림"]. 멈춘 뒤 3번 확인은 그대로
  relax_max_steps: 30           # 3 mm 올려도 상한 넘으면 PUSH_BLOCKED
  shift_mm: null                # null = 계산: 옆벽 쪽 잡기에 모자란 만큼 + extra_mm (넛지 필요 없는 자리면 안 끎) [사용자 10/10 "얼마나 넛지해야 집을 수 있는지 계산"]. 예전 40 고정 [사용자 10/07 저녁, 비전 y 오차 2 mm]
  max_force_n: 15.0             # 끄는 중 옆(수평) 힘 변화가 이보다 크면 멈춤 (걸림). 8 → 15: 오른쪽 벽에 붙은 지우개를 잘 끌다 8.2 N 에서 멈춤 [사용자 10/10 PC2]. 끌기 직전 힘 0점 다시 잡음
  max_force_z_n: 10.0           # 끄는 중 위아래 힘 변화 상한 — z 14 N 이면 열린 서랍이 앞으로 넘어감, 10 N 넘지 않게 [사용자 10/07] (예전엔 크기 하나로 8)
  tilt_deg: 20.0                # 30 → 20 [사용자 10/07 "30° 너무 큼"]. 벽 쪽 손끝·가운데 쪽 손목으로 기울임 (사용자 결정 10/06). 손끝이 반원이라 기울여도 닿는 점이 손가락 중심 근처 →
                                #   벽에 붙은 세로 지우개도 접촉점이 지우개 위 (tip_contact) [계산 10/06, 실물 확인 필요]
                                #   30°인 이유·각도별 비교·바꿀 조건: practice/B/2026-10-06_practice.md 트러블슈팅 2 "기울기 30°"
  close_axis: wall              # 손가락 닫힘 축: wall = 옆벽 법선(서랍 y, 평상시 방향) / object = 물체 긴 변.
                                #   [실측 B 10/06] wall + 옆벽 쪽 30°: 모서리에 최대로 넣어 TCP–옆벽 경계 5.0 mm(수직은 21.6 mm에서 관절 걸림),
                                #   세로 지우개 윗면 눌러 옆으로 잘 끌림. object 는 계산만 (tip_contact, 실물 미확인)
  wall_tcp_min_by_drawer_mm:     # 서랍·옆벽별 누르는 TCP–옆벽 경계 (없으면 아래 wall_tcp_min_mm). y_min = 왼쪽(t1 쪽), y_max = 오른쪽
