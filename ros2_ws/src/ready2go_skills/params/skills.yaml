# ready2go_skills 파라미터 (담당 B). 확정 전 값은 [팀 확정 필요] — 코드에 두지 않는다.
# 기대 TCP·툴 이름은 config/calibration/calibration_meta.yaml, 서랍 기준 인출 거리는 config/places.yaml tf_at_travel_m 에서 읽는다(복사하지 않음).
motion_guard:   # core/motion_guard.py (#15)
  travel_tolerance_m: 0.005     # [팀 확정 필요] drawer_displacement 와 tf_at_travel_m 차이 허용. 넘으면 DRAWER_NOT_AT_TRAVEL. 실측(스토퍼 재현성) 후 확정
  on_floor_tolerance_m: 0.01    # [팀 확정 필요] top_z − 물체 높이 허용. 넘으면 NOT_ON_FLOOR. 검정·반사 물체 뎁스 오차(#15 A 코멘트) 실측 후 확정
drawer_control:   # core/drawer_plan.py (#13, docs/domain.md 8.4). 모두 [팀 확정 필요] — 10/06 실물 측정 후 확정
  approach_mm: 108.0            # [실측 B 10/04] drawer_approach → 손잡이 파지까지 직선 접근 거리 (poses.yaml drawer_approach 주석)
  pos_tol_m: 0.002              # 목표·닫힘 위치 도달 판정 여유
  stuck_force_n: 30.0           # [추정] 인출 중 저항이 이보다 크면 DRAWER_STUCK (즉시 정지). 정상 인출 저항을 재서 여유 두고 정함
  close_force_n: 15.0           # [추정] 닫힘 판정 미는 축 저항 임계. 닫힘 위치에서 밀 때 힘을 재서 정함
  close_overtravel_m: 0.005     # 닫힘 위치보다 이만큼 더 밀어 힘 임계에 닿게 함 (컴플라이언스로 부드럽게)
  reopen_m: 0.05                # CLOSE_NOT_CONFIRMED 후 다시 여는 거리 (8.4 복구 ①)
  force_sign: 1.0               # [추정] get_tool_force 부호 규약. 실측에서 저항력이 음수로 나오면 -1.0
pick:   # core/pick_plan.py (#15)
  tcp_above_top_m: 0.0          # [실측 B 10/04, #8] TCP를 물체 윗면 높이에 둠 — 지우개(11.5 mm) TCP 바닥 위 10.0~11.4 mm에서 3/3 파지. 높은 물체는 10/06 확인
  min_tcp_above_floor_m: 0.010  # [실측 B 10/04, #8] 성공한 가장 낮은 TCP 높이. 닫힌 손끝이 TCP보다 약 10 mm 아래라 이보다 낮추지 않음
  open_margin_m: 0.013          # [실측 B 10/04, #8] 벌림 = 짧은 변 + 13 mm (지우개 22 mm → 35 mm). 완전히 벌리면 손끝이 바닥에 닿음
  max_open_width_m: 0.100       # [문서] RG2 최대 110 mm에서 여유를 뺀 값 (#8 판정 기준)
  finger_axis_offset_deg: null  # [팀 확정 필요] TCP Rz와 손가락 닫힘 축의 관계. 10/06 실물에서 정함 (노드에서 사용)
# ---- 아래는 실물 동작 (10/05~06 로봇 실측, practice/B/2026-10-06_practice.md). 단위: 거리 mm(표기 _m은 m), 속도 mm/s, 힘 N ----
gripper:
  rg2_ip: 192.168.1.1           # [실측] 환경변수 RG2_HOST 가 있으면 그 값
  finger_axis: x                # [실측 B 10/05] 손가락은 툴 x축 방향으로 닫힘 (수직 아래 자세에서 base ±x)
  min_width_m: 0.002            # 이 폭 이하면 빈손 (빈손 닫힘 0.9 mm, grip_detected True [실측 B 10/03, 10/05])
  slip_tolerance_m: 0.002       # 잡은 뒤 폭 변화 허용 (지우개 고무 눌림 0.6 mm [실측 B 10/04])
  grasp_width_tolerance_m: 0.003   # 잡은 폭 vs 짧은 변 (지우개 22 → 21.0~21.4 mm [실측 B 10/04·10/06])
  default_grip_force_n: 20.0    # item_grasp.yaml grip_force 가 null 일 때 [실측 B 10/04: 지우개 20 N 3/3]
  open_margin_mm: 13.0          # 벌림 = 짧은 변 + 이 값 [실측 B 10/04]
  tip_below_tcp_mm:             # 손끝이 TCP보다 아래인 거리 — 벌릴수록 손끝이 올라감 [실측 B 10/03·10/06, 트러블슈팅 1]
    open_mm: [0.9, 35.0]        #   크게 벌리면 손끝이 TCP보다 약 17 mm 위 [실측 10/06, 폭 85·100 중 확인 필요] → 표 밖은 끝값(외삽 안 함)
    below_mm: [10.0, 2.5]
  wall_clearance_mm:            # TCP가 벽에 갈 수 있는 최소 거리 [실측 B 10/05 서랍 옆벽, 10/06 손잡이 쪽 벽 35 mm에서 5.7~6.9 → 9 유지]
    across: {open_mm: [0.9, 35.0, 60.0, 100.0], dist_mm: [21.6, 39.9, 46.6, 59.6]}   # 닫힘 축이 벽과 직각 (손가락 바깥 관절이 먼저 닿음)
    along_mm: 9.0               # 닫힘 축이 벽과 나란히 (닫힘 9.0, 최대 벌림 8.7)
  wall_margin_mm: 3.0           # 위 거리에 더하는 여유 [팀 확정 필요]
  tip_radius_mm: 15.8           # 손끝 끝(옆에서 본 반원 U) 반지름 ≈ 닫힘 축에 수직인 손가락 반폭 [계산 10/06: 옆벽 along 9.0 + 바닥에서 실제 벽이
                                #   서랍 좌표 경계보다 6.8 mm 바깥(벽에 붙인 지우개 중심 터치) — 사진상 끝이 반원 (사용자 10/06)] [실물 확인 필요]
  fingertip_outer_mm: 13.0      # TCP → 닫힌 손끝 바깥면 (지우개 양옆 터치 47.06 − 21.0 = 26.06 → 반) [실측 B 10/06]
speed:                          # [팀 확정 필요] 처음엔 낮게
  line_mm_s: 50.0
  approach_mm_s: 25.0           # 물체·손잡이 바로 앞
  grasp_mm_s: 15.0              # 마지막 내려가기·놓기
  pull_mm_s: 40.0               # 서랍 당기기
  push_mm_s: 30.0               # 서랍 밀어 닫기
transit:
  safe_z_mm: 300.0              # 장소 사이 이동 높이 (서랍 테두리 바닥+68 ≈ 264, 위로 넉넉히). drawer_top_view z 363은 팔 거의 펴짐(A 10/04)
drawer_open_close:              # drawer_control 실물 (위 drawer_control 판정값과 함께)
  handle_grasp_posx:            # 손잡이 파지 TCP posx — 서랍 닫힌 상태 [실측 B 10/04, poses.yaml drawer_approach 주석]
    drawer_top: [382.105, -291.757, 268.641, 89.981, -89.964, 179.892]   # 끝까지 연 손잡이 [382.264, -66.470, 268.556] → 인출 225.3 mm [실측 B 10/06]. [실측 B 10/06 재측정, 꽉 잡음, posj [7.269, 17.642, 116.824, 95.151, -95.372, -45.383]] — 10/04 값과 y 0.7 mm 차이
    drawer_bottom: null         # 교시 전 → DRAWER_NOT_CONFIGURED (움직이지 않음)
  handle_open_width_mm: 30.0    # 손잡이 잡으러 갈 때 벌림 [팀 확정 필요]
  handle_contact_n: 8.0         # 손잡이로 들어가다 당김 축으로 이만큼 닿으면 멈추고 뒤로 (10/06 실물: 서랍이 덜 닫혀 너무 깊이 들어감) [추정]
  handle_grip_force_n: 40.0     # [팀 확정 필요]
  handle_min_width_m: 0.003     # 손잡이를 잡았는지. [실측 B 10/06] 위 서랍 손잡이 꽉 잡은 폭 7.9 mm (못 잡으면 약 0.9 mm)
  retreat_mm: 60.0              # 손잡이를 놓고 물러나는 거리 (여는 방향)
  stopper_window_mm: 10.0       # 목표 이 거리 안에서 걸리면 스토퍼 도달로 봄 (닫힌 위치가 몇 mm 어긋난 경우)
  fist_offset_mm: 13.5          # 닫은 주먹 앞면 → TCP (닫힌 손끝 TCP 앞 10 + 손잡이 반 3.5) [계산, 실측 필요]
  push_standoff_mm: 30.0        # 닫을 때 손잡이 앞에서 시작하는 거리
  close_pos_tol_m: 0.008        # 닫힘 위치 판정 여유 (주먹 오프셋 오차 포함) [팀 확정 필요]
place:
  drop_m: 0.0015                # 집을 때 TCP 높이 + 이 값에서 놓음 → 물체가 1.5 mm 떠서 놓임 [팀 확정 필요]
  release_extra_mm: 6.0         # 놓을 때 잡은 폭보다 이만큼 더 벌림 (옆 칸 물건과 간섭 줄임, 칸 폭 45 mm)
  approach_m: 0.06              # 놓기 전 위 높이
drag:                           # nudge_object 실물: 기울여 손끝으로 눌러 옆으로 끌기 (트러블슈팅 2, #37)
  # [실측 B 10/06] 지우개 모서리 2 N에서 잘 끌림. 위치로 누르면 1 mm에 2 → 10 N → 힘 감지로 멈춤.
  #   힘 영점이 시간에 따라 흐름 → 내려가기 직전 0점. 서랍 닫히는 방향 끌기는 서랍이 같이 밀림 → 서랍 옆(y)으로만.
  press_force_n: 2.0            # 접촉 판정·누르는 힘
  max_force_n: 15.0             # 끄는 중 힘 변화가 이보다 크면 멈춤 (걸림)
  tilt_deg: 30.0                # 벽 쪽 손끝·가운데 쪽 손목으로 기울임 (사용자 결정 10/06). 손끝이 반원이라 기울여도 닿는 점이 손가락 중심 근처 →
                                #   벽에 붙은 세로 지우개도 접촉점이 지우개 위 (tip_contact) [계산 10/06, 실물 확인 필요]
                                #   30°인 이유·각도별 비교·바꿀 조건: practice/B/2026-10-06_practice.md 트러블슈팅 2 "기울기 30°"
  close_axis: wall              # 손가락 닫힘 축: wall = 옆벽 법선(서랍 y, 평상시 방향) / object = 물체 긴 변.
                                #   [실측 B 10/06] wall + 옆벽 쪽 30°: 모서리에 최대로 넣어 TCP–옆벽 경계 5.0 mm(수직은 21.6 mm에서 관절 걸림),
                                #   세로 지우개 윗면 눌러 옆으로 잘 끌림. object 는 계산만 (tip_contact, 실물 미확인)
  wall_tcp_min_mm: 5.0          # close_axis wall, 30°: TCP가 옆벽 경계에 다가갈 수 있는 거리 [실측 B 10/06] (+ gripper.wall_margin_mm)
  wall_tip_below_mm: 11.7       # close_axis wall, 30°: 손끝이 TCP 아래 [실측 B 10/06, 지우개 윗면 터치] — 다른 각도면 다시 잴 것
  press_speed_mm_s: 5.0         # 내려가며 접촉 찾기
  speed_mm_s: 10.0              # 끄는 속도
  search_below_mm: 4.0          # 예상 접촉 높이보다 이만큼 더 내려가도 접촉이 없으면 실패
  start_above_mm: 25.0          # 예상 접촉 높이 위에서 시작
  extra_mm: 3.0                 # 계산한 최소 거리에 더하는 여유 (세로 지우개 모서리 → 약 35 mm)
  max_shift_mm: 80.0
  press_inset_mm: 3.0           # 누르는 점은 물체 가장자리에서 이만큼 안쪽까지
  lift_mm: 30.0                 # 끈 뒤 올라가는 거리
