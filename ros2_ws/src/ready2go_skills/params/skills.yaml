    # {start_posj·start_posx: 끝까지 연 상태 앞판 3 cm 앞 (같은 자리의 posj·posx), end_posx: 닫힌 상태 앞판에 손끝 닿는 posx} — 같은 높이·x. 미는 동안 손목은 시작 그대로, 끝은 y 만 씀
