      start_posx: [391.141, -43.810, 86.628, 90.001, -135.000, 89.992]  # [계산] 위 칸 시작과 같은 x·y·손목. 홈→시작 관절 이동 중 TCP y ≥ −42.5 (열린 앞판 약 −73 보다 앞) [계산]
      end_posx: [391.355, -298.648, 86.625, 90.034, -134.993, 89.900]  # y −3 mm 더 밀기 [사용자 10/10 PC2: 약 3 mm 덜 닫힘] (실측 −295.648). [실측 B 10/08] 닫힘 앞판 중앙. posj [-8.579, 12.677, 111.049, -52.890, 61.398, 20.318]
