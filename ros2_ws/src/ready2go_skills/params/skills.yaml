  view_lift_blend_mm: 50.0      # 홈 쪽 → 탑뷰: 올리기 끝 이 거리부터 관절 이동(회전) 시작 — 올라가기·회전이 같이 끝남 [사용자 10/08]. 올리는 길이의 45% 까지
  safe_z_mm: 300.0              # 서랍 안 이동·집은 뒤 올리는 높이 = 테두리 약 268 + 쥔 물체 12 + 여유 20. drawer_top_view z 363은 팔 거의 펴짐(A 10/04)
drawer_open_close:              # drawer_control 실물 (위 drawer_control 판정값과 함께)
