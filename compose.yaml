# ready2go — 장비별 실행: docker compose --profile <real|sim|dev> up  (자세한 설명: docs/docker.md)
name: ready2go

x-ros-env: &ros-env
  ROS_DOMAIN_ID: "70"                                  # 강사 배정 조별 Domain ID (확정)
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp               # 강사 제공 표준 (확정)
  CYCLONEDDS_URI: file:///config/cyclonedds.${DDS_MODE:-local}.xml   # local | multi
  DDS_IFACE: ${DDS_IFACE:-}        # multi 모드: 팀 공유기에 연결된 NIC 이름
  PEER_PC1: ${PEER_PC1:-}          # multi 모드: 장비 IP
  PEER_PC2: ${PEER_PC2:-}

services:
  ros2-core:
    profiles: ["real", "sim", "dev"]
    build: ./docker/ros2-core
    network_mode: host
    environment: { <<: *ros-env, BACKEND: "${BACKEND:-mock}", ROBOT_HOST: "${ROBOT_HOST:-127.0.0.1}", RG2_HOST: "${RG2_HOST:-}",
                   MOCK_FAIL: "${MOCK_FAIL:-}", MOCK_NOT_VISIBLE: "${MOCK_NOT_VISIBLE:-}", MOCK_DURATION_SEC: "${MOCK_DURATION_SEC:-0.5}", MOCK_SPEAK: "${MOCK_SPEAK:-on}", MOCK_SCENE: "${MOCK_SCENE:-}", RUNNER_TASK_FILE: "${RUNNER_TASK_FILE:-}",
                   RUNNER_ONTOLOGY_FILE: "${RUNNER_ONTOLOGY_FILE:-/knowledge/robot_ontology.jsonld}", RUNNER_INTENT_TASKS: "${RUNNER_INTENT_TASKS:-}", RUNNER_RESUMABLE: "${RUNNER_RESUMABLE:-}",
                   SKILL_JOINT_VEL_DEG_S: "${SKILL_JOINT_VEL_DEG_S:-60.0}", SKILL_JOINT_ACC_DEG_S2: "${SKILL_JOINT_ACC_DEG_S2:-40.0}",
                   SKILL_START_DELAY_S: "${SKILL_START_DELAY_S:-15.0}",
                   PYTHONDONTWRITEBYTECODE: "1" }  # real: 실물 제어기·RG2 IP / mock: 실패 시험 / 소스 폴더에 root 소유 __pycache__ 안 만듦 [실측 10/04]
    volumes:
      - ./ros2_ws:/ros2_ws
      - ./contracts:/contracts:ro    # JSON Schema 계약
      - ./tasks:/tasks:ro            # JSON 태스크 템플릿
      - ./knowledge:/knowledge       # 온톨로지 (런타임 갱신)
      - ./logs:/logs                 # 실행 로그 JSON
      - ./config:/config:ro          # 기준 포즈, 서랍 좌표계, 캘리브레이션 결과

  vision:
    profiles: ["real", "sim"]
    build: ./docker/vision
    network_mode: host
    environment: { <<: *ros-env, VISION_MODE: "${VISION_MODE:-yolo}" }   # yolo | yolo_sam2(조건부) | oracle(sim 전용)
    volumes: [./models:/models:ro, ./config:/config:ro]
    deploy:                          # GPU 추론 (NVIDIA Container Toolkit 필요)
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  vision-node:                       # PC2 한 대 통합점검(tools/dev/pc2_up.sh): 비전 노드까지 compose 로. 기존 vision_real_check.sh node 와 같은 노드·설정
    profiles: ["pc2"]                # real 과 함께 켤 때만 (--profile real --profile pc2) — 기존 real·sim 기동은 그대로
    image: ready2go-vision:latest    # vision 서비스가 만든 이미지 (없으면 docker compose --profile real build vision)
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # 덤프 파일을 내 계정 소유로 (스크립트 --user 와 같게)
    environment: { <<: *ros-env, HOME: /tmp, YOLO_CONFIG_DIR: /tmp/y, CODE_SHA: "${CODE_SHA:-unknown}" }
    volumes:
      - ./ros2_ws:/ros2_ws:ro        # 시작할 때 /tmp 에 빌드 (스크립트와 같음)
      - ./config:/config:ro
      - ./knowledge:/knowledge:ro
      - ./models:/models:ro
      - ${VISION_DUMP:-${HOME}/ready2go_vision_dump}:/dump   # 요청마다 프레임 저장 (A 원인 확인용)
    command: >-
      bash -lc 'source /opt/ros/jazzy/setup.bash && cd /ros2_ws &&
      colcon --log-base /tmp/clog build --build-base /tmp/build --install-base /tmp/install --packages-up-to ready2go_vision >/tmp/build.log 2>&1
      || { tail -30 /tmp/build.log; exit 1; };
      source /tmp/install/setup.bash &&
      exec ros2 run ready2go_vision inspect_region --ros-args -p config_dir:=/config -p dump_dir:=/dump -p "code_sha:=\"$${CODE_SHA}\""'
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  realsense:
    profiles: ["real"]
    build: ./docker/realsense
    network_mode: host
    privileged: true                 # USB 재연결 시 장치 번호가 바뀌므로 /dev 전체 공유
    environment: *ros-env
    volumes: ["/dev:/dev", "./config:/config:ro"]   # CYCLONEDDS_URI가 /config를 가리킴

  voice:
    profiles: ["real", "sim", "dev"]
    build: ./docker/voice
    network_mode: host
    env_file:
      - path: ./secrets/voice.env    # OPENAI_API_KEY (Git 제외, secrets/voice.env.example 복사)
        required: false
    environment: { <<: *ros-env, PULSE_SERVER: "unix:${XDG_RUNTIME_DIR}/pulse/native" }
    volumes:
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
      - ./knowledge:/knowledge:ro
      - ./models:/models:ro
      - ./config:/config:ro

  db:
    profiles: ["real", "sim", "dev"]
    image: mongo:7.0                 # 8.0 은 커널 6.19+ 에서 기동 거부, 팀 PC 모두 커널 7.0 (결정 #18 변경, 이슈 #34)
    network_mode: host
    volumes: ["./db_data:/data/db"]    # 로그·상태 영속 저장

  dsr-emulator:
    profiles: ["sim", "dev"]
    image: doosanrobot/dsr_emulator:3.0.1
    network_mode: host
    environment: { ROBOT_MODEL: m0609 }   # 결정 #1 로봇 기종
    tty: true                        # 시작 스크립트(start_services.sh)가 tty 없으면 바로 종료됨 [실측 10/03]
    stdin_open: true

  mock-sim:
    profiles: ["dev"]
    build: ./docker/mock-sim
    network_mode: host
    environment: *ros-env
    volumes: ["./config:/config:ro"]   # CYCLONEDDS_URI가 /config를 가리킴 (없으면 다른 DDS 설정으로 떠서 송수신 실패 [실측 10/03])
